 "ES-C.6.1":"RF-ES C.6.1: Apply software development techniques and procedures (design principles, patterns, reuse).",
 "ES-C.6.7":"RF-ES C.6.7: Apply software development principles, patterns and good practices.",
 "ES-C.4.3":"RF-ES C.4.3: Apply software maintenance and evolution techniques and procedures (refactoring)."
},
skills:{
var:{name:"Variables",about:"Storing values, types and basic operators.",client:"Dona Lúcia's bakery",title:"The till that never balances",
 story:"Every night Dona Lúcia closes the bakery till in a notebook, and the numbers never match. Her nephew built a spreadsheet, but the bread price was typed as text, and adding two loaves gave \"4.504.50\". She asks for something simple: record price, quantity and change without mistakes. Before any pretty screen, the system must store each piece of data with the right type.",
 theory:[["A variable is a name for a value","It keeps a piece of data in memory for later use. Assignment copies the value at that moment; it does not create a permanent link between two variables."],
  ["Every value has a type","Integers, decimals, text and booleans behave differently. With text, + joins; with numbers, it adds. Money calls for a decimal; quantity calls for an integer."],
  ["Integer division and remainder","Integer division drops the decimal part, and the % operator returns what is left over. They are the basis for change, parity and splitting into groups."]]},
cond:{name:"Conditionals",about:"Choosing the program's path with if, else if and else.",client:"Neighbourhood health clinic",title:"The queue that cannot be first come, first served",
 story:"At the health clinic, nurse Rosa does triage in her head: high fever goes first, the elderly have priority, everyone else waits. When she is away, the queue becomes first come, first served, and a serious case waits two hours. The clinic wants the system to apply Rosa's rules every time, including edge cases such as a fever of exactly 39 degrees.",
 theory:[["A condition is a yes-or-no question","The program evaluates a boolean expression and follows a single path. Operators such as >, >= and == define exactly where the boundary lies."],
  ["The order of tests matters","In an if / else if chain, the first true test wins and the rest are not even evaluated. The strictest rule must come first."],
  ["Combining conditions","AND (and, &&) needs both to be true; OR (or, ||) needs at least one. AND is evaluated before OR; when in doubt, use parentheses."]]},
loop:{name:"Loops",about:"Repeating instructions with for and while.",client:"Paulo Freire Municipal School",title:"Four hundred report cards by hand",
 story:"Marta, the school secretary, computes the average of 400 students on a calculator, one by one, every term. It takes three days and a mistake always slips through. The calculation is the same for everyone; only the grades change. It is the picture of a task that calls for automatic repetition: write the rule once and let the computer walk through the whole list.",
 theory:[["for: repeat for each element","Use it when the number of repetitions is known: each student in the list, each number from 0 to n-1. Counting usually starts at 0 and stops before the limit."],
  ["while: repeat while something is true","Use it when you do not know how many rounds there will be. Something inside the loop must move towards the exit, or it never ends."],
  ["The accumulator pattern","A variable starts with a neutral value (0, empty, first element) and is updated every round: sum, count, largest value."]]},
func:{name:"Functions",about:"Packaging logic: parameters, return and scope.",client:"Roda Viva delivery co-op",title:"Shipping computed in three places",
 story:"The couriers' co-op computes shipping on the website, in the app and in the finance spreadsheet. When the price per kilometre went up, someone updated only two of the three, and for a week couriers were paid less than they were owed. There is one rule; it must live in one place and be called by everyone.",
 theory:[["A function is a rule with a name","It takes parameters, runs steps and hands back a result with return. Defining once and calling everywhere removes diverging copies."],
  ["Returning is not printing","Printing shows the value on screen; returning hands the value to the caller, who can use it in other calculations."],
  ["Scope and pass by value","Variables created inside a function are local and vanish at the end. Numbers passed as arguments arrive as copies: changing them inside does not change the original."]]},
col:{name:"Collections",about:"Lists and dictionaries, indexes and references.",client:"Casa das Letras community library",title:"The loan notebook is gone",
 story:"The community library kept its loans in a notebook, which got soaked in the last storm. Mr Antônio wants to know which books exist, how many copies there are of each, and who has what. That is a lot of data of the same kind: loose variables cannot hold it. It is time to organise data into collections.",
 theory:[["List: an ordered sequence","It holds several values accessed by position. The index starts at 0, so a list with 3 items runs from index 0 to 2."],
  ["Dictionary or map: lookup by key","It ties a key to a value, such as title to copies. It is the right choice when you search by name rather than by position."],
  ["Collections are shared by reference","Assigning a list to another variable does not copy the data: both names point to the same collection. To duplicate it, you must copy explicitly."]]},
rec:{name:"Recursion",about:"Functions that call themselves, and the base case.",client:"2nd District Notary Office",title:"Folders inside folders inside folders",
 story:"The notary office scanned 40 years of documents into folders inside folders, with no standard depth. Helena, the clerk, needs to count how many files exist in total. A simple loop will not do, because every folder may hold others. The natural solution is: count the files in this folder and repeat the same procedure on each subfolder.",
 theory:[["A problem defined in terms of itself","The function solves a small piece and delegates the rest to a call to itself on a smaller problem."],
  ["Base case: the brake","It is the simple situation answered without a new call (empty folder, n equal to 0). Every recursive call must move towards it."],
  ["The call stack","Each call waits for the next one to finish. Whatever comes after the recursive call only runs on the way back, from the innermost to the outermost."]]},
req:{name:"Requirements",about:"Discovering and writing what the software must do.",client:"Neighbourhood health clinic",title:"\"I want an app\"",
 story:"The clinic director arrives at the meeting determined: \"I want an app just like the bank's\". After half an hour of conversation, the real problem surfaces: patients miss appointments because they forget the date, and 30% of slots are wasted. Perhaps the solution is a simple text reminder. Whoever builds what was asked for, without understanding what is needed, delivers the wrong software right on time.",
 theory:[["Needs come before solutions","Clients describe solutions; the engineer investigates the problem behind them with interviews, observation and prototypes (elicitation)."],
  ["Functional and non-functional","Functional is what the system does (schedule, remind). Non-functional is how well it does it (response time, security, availability)."],
  ["A good requirement is verifiable","\"Fast\" and \"friendly\" cannot be tested. \"Responds within 2 s for 95% of queries\" can. User stories follow: As a [role], I want [action], so that [benefit]."]]},
agil:{name:"Agile",about:"Sprints, MVP and incremental delivery.",client:"Paulo Freire Municipal School",title:"Enrolment opens in six weeks",
 story:"The school wants a complete enrolment system, with report cards, meals and transport. Enrolment opens in six weeks, and the wish list would take six months. If the team disappears and returns only when everything is ready, it will be too late. The way out is to deliver the essential part working first, enrolment, and grow from real use.",
 theory:[["Deliver in short cycles","A sprint has a fixed length and ends with a usable increment. Feedback from real users guides the next cycle."],
  ["MVP: learn early","The minimum viable product solves the core problem end to end, at small scale, to validate hypotheses before investing more."],
  ["Scope is the adjustment variable","Deadline and quality stay fixed; what goes in is negotiated. Limiting work in progress helps the team finish before starting something new."]]},
git:{name:"Git",about:"Versioning code: commits, branches and merges.",client:"The Ponte team",title:"The Friday the code vanished",
 story:"On Friday afternoon, Caio and Bia edited the same file of the bakery system. Each saved their version to the shared folder as \"final_this_time_for_real.zip\". The last save wiped out the other's work, and nobody could tell which version was live. Ponte decided: from Monday on, all code lives in a Git repository.",
 theory:[["Commit: a snapshot with a caption","It records the state of the project with author, date and message. Clear messages tell what changed and why."],
  ["Branch: working in parallel","Each feature is born on an isolated branch, and the main line stays stable until review and integration (merge)."],
  ["A conflict is a request for a decision","If two branches change the same lines, Git does not choose alone: it shows both versions and asks someone to decide."]]},
test:{name:"Testing",about:"Checking code with automated tests.",client:"Dona Lúcia's bakery",title:"The discount that overcharged",
 story:"The bakery launched a 10% discount for purchases from 50 reais. One customer spent exactly 50 and got no discount; another got it twice. Dona Lúcia gave money back all week. The mistake was in a boundary comparison nobody tested. A three-line automated test would have raised the alarm before the customer did.",
 theory:[["Unit test","It checks a small isolated unit, such as a function, quickly and repeatably. The pattern is Arrange, Act, Assert."],
  ["Boundary values","Defects cluster at the limits of rules. Test just below, exactly at, and just above the boundary."],
  ["Regression tests and the limits of testing","Every fixed bug gets a test that reproduces it, so it never returns. Tests reveal the presence of defects, but do not prove their absence."]]},
design:{name:"Design",about:"Cohesion, coupling, SOLID and refactoring.",client:"Roda Viva delivery co-op",title:"One more payment method, one more patch",
 story:"The co-op took cash; then came cards, then Pix instant payments, now meal vouchers. With each novelty, someone adds one more \"if\" to a 300-line function everyone is afraid to touch. After the last change, Pix stopped working for two days. The software works, but it has become expensive to change. That is a design problem.",
 theory:[["High cohesion, low coupling","Each module takes care of one subject and depends little on the others. That way it can be understood, tested and replaced in isolation."],
  ["SOLID principles","Single responsibility: one reason to change. Open/closed: extend without editing what already works. Dependency inversion: depend on interfaces, not on concrete implementations."],
  ["Refactoring","Improving structure without changing behaviour, in small steps protected by tests: extract function, remove duplication, give clear names."]]}
},
items:{
v1:{title:"The label that moved",prompt:"Dona Lúcia copied the old price before raising it. What does the program print?",hint:"Go line by line: what was x worth at the moment y received it?",why:"y receives a copy of the value x had at that moment (5). Changing x afterwards does not affect y.",analogy:"A variable is a label on a value. y got its own label on the 5; moving the x label to the 8 does not touch y's."},
v2:{title:"The sum that does not add",prompt:"This was the nephew's spreadsheet mistake. What does the program print?",hint:"Look at the quotes: are these values numbers or text?",why:"Inside quotes, 3 and 4 are text. With text, the operation joins instead of adding.",analogy:"Strings are bead necklaces: joining two necklaces gives a longer necklace, not a sum. To add, convert to numbers first."},
v3:{title:"A swap that loses a value",prompt:"The code should swap a and b, but prints 2 2. On which line is the original value of a lost?",hint:"After which line does the number 1 no longer exist in any variable?",why:"When a receives b, the 1 is overwritten without being saved. A correct swap uses a temporary variable.",analogy:"To swap the contents of two glasses you need a third glass. Pouring one straight into the other loses one of the drinks."},
v4:{title:"Splitting the change",prompt:"Seven coins split between two tills. What does the program print?",hint:"Integer division drops the decimal part; % returns what is left.",why:"The integer division of 7 by 2 is 3, and the remainder is 1.",analogy:"Sharing 7 sweets between 2 children: each gets 3 and 1 is left on the table."},
v5:{title:"The right type for a price",prompt:"Which data type best stores the price 4.50 of a loaf of bread?",opts:["Decimal number (floating point)","Integer","Text","Boolean"],hint:"The value has cents and will be used in calculations.",why:"A price has decimals and takes part in arithmetic, so it needs a decimal numeric type. As text it could not be added; as an integer it would lose the cents.",analogy:"It is picking the right container: water goes in a bottle, not in a sieve. Each data type was made for one kind of content."},
c1:{title:"A fever of exactly 39",prompt:"A triage boundary rule. What does the program print?",hint:">= means greater than OR equal to.",why:"7 >= 7 is true, so only the first block runs and the else is skipped.",analogy:"if/else is a fork in the road: the car takes one side only, never both."},
c2:{title:"The order of Rosa's rules",prompt:"The rules were written in this order. What does the program print?",hint:"Once a test in the chain is true, the following ones are not even evaluated.",why:"30 > 20 is already true, so only A is printed. The stricter condition (t > 28) should come first.",analogy:"It is a row of turnstiles: whoever passes the first does not try the others. The most demanding turnstile must stand in front."},
c3:{title:"Even or odd ticket number",prompt:"The clinic calls even numbers to desk 1 and odd numbers to desk 2. Assemble the program that classifies the number.",hint:"First the data exists; then comes the test on the remainder of division by 2.",why:"The data must exist before the test. A zero remainder when dividing by 2 means even; else covers everything else.",analogy:"Just like triage: first the patient arrives, then comes the question, and each answer leads to a room."},
c4:{title:"Who goes first: AND or OR",prompt:"Is the result of the expression true or false?",opts:["True","False","Error","It depends on the language"],hint:"Just as multiplication comes before addition, one logical operator is evaluated first.",why:"AND takes precedence over OR. First false AND false gives false; then true OR false gives true. This holds in all four languages of the game.",analogy:"Just like 2 + 3 × 0: you do the multiplication first. AND is the multiplication of logic; when in doubt, use parentheses."},
c5:{title:"Sixty and no discount",prompt:"People aged exactly 60 should pay half price but pay full. Which line needs fixing?",hint:"Test it in your head with 60: is the condition true?",why:"60 > 60 is false. The rule \"from 60\" calls for >=. Boundary errors are among the most common in conditionals.",analogy:"It is the sign \"minimum height 1.40 m\" with a guard who stops anyone measuring exactly 1.40. The rule is right; the comparison is wrong."},
l1:{title:"Where counting starts",prompt:"Which values does the loop print?",hint:"Counting starts at 0 and stops before 3.",why:"It produces 0, 1 and 2: three values, starting from zero and not including 3.",analogy:"Like floors in a building that starts at ground level (0): three storeys run from 0 to 2."},
l2:{title:"Adding up the grades",prompt:"What does the program print?",hint:"The loop includes 1 and excludes 5.",why:"The loop goes through 1, 2, 3 and 4, and the sum is 10. The upper limit is left out.",analogy:"total is a piggy bank: each round drops in a coin worth i. At the end you count what is inside."},
l3:{title:"Countdown without end",prompt:"The code should print 3, 2, 1 and then \"end\", but never stops. Which line needs fixing?",hint:"For the loop to stop, n > 0 must become false at some point.",why:"Adding 1 moves n away from zero, so the condition is always true. The fix is to subtract 1.",analogy:"It is going down a staircase by climbing one step each time: you never reach the floor. Every while must move towards the exit."},
l4:{title:"The highest grade in the class",prompt:"Marta wants the highest grade in the list. Assemble the program.",hint:"Start by assuming the first is the highest; then compare with each one.",why:"The pattern is: initial guess (first element), go through everything, replace the champion when someone higher shows up, and print only after the loop.",analogy:"It is \"king of the hill\": the first one climbs to the top and each challenger only takes over if higher. Whoever is there at the end is the maximum."},
l5:{title:"How many times can you halve it",prompt:"What does the program print?",hint:"Follow n each round: 16, 8, ...",why:"n goes through 8, 4, 2 and 1: four divisions until n > 1 becomes false.",analogy:"Folding a sheet in half again and again: the while does not know in advance how many folds there will be; it just stops when no more are possible."},
f1:{title:"Using the returned value",prompt:"What does the program print?",hint:"return hands the result to whoever called the function.",why:"The function returns 8, stored in r. Then 8 + 1 = 9.",analogy:"A function is a juicer: fruit goes in (argument) and a glass comes out (return value), which you use as you like."},
f2:{title:"Printing is not returning",prompt:"A function computes the shipping cost and only prints it, without returning it. What is the consequence?",opts:["The caller cannot use the value in other calculations","None: printing and returning are equivalent","The function becomes faster","The value automatically becomes global"],hint:"Where does a printed value go? And a returned one?",why:"Printing sends the value to the screen and nothing more. Returning hands the value to the calling code, which can add it, store it or pass it on.",analogy:"Printing is showing the dish in the shop window; returning is handing it to the customer. Whoever only saw the window leaves empty-handed."},
f3:{title:"The x inside and the x outside",prompt:"What does the program print?",hint:"Is the variable created inside the function the same as the one outside?",why:"x = 99 is a local variable that exists only during the call. The outer x is still 10.",analogy:"A function is a room with its own whiteboard. What is written inside is erased on the way out and does not change the board in the corridor."},
f4:{title:"A function for the average",prompt:"Assemble the function that computes the average of a list and the call that prints the result.",hint:"Inside the function: reset the total, accumulate in the loop, and only then return the division.",why:"return comes after the loop, otherwise the function would leave on the first round. The call comes after the definition.",analogy:"A cake recipe: first the recipe's name, then the steps in order, and you serve only at the end. You cannot serve halfway through mixing."},
f5:{title:"The argument is a copy",prompt:"What does the program print?",hint:"Does the function receive the variable x itself or a copy of its value?",why:"Numbers are passed by value: n is a copy of x. Changing n inside the function does not change x, which is still 5.",analogy:"You hand over a photocopy of the document. They may scribble on the copy at will: the original in your drawer stays intact."},
k1:{title:"Indexes start at zero",prompt:"What does the program print?",hint:"The first element is at index 0.",why:"The indexes are 0 (10), 1 (20) and 2 (30).",analogy:"The index is the distance to the front of the queue: the first person is 0 steps away, the second is 1 step away."},
k2:{title:"Two variables, a single list",prompt:"What does the program print?",hint:"Is the second variable a new collection or another name for the same one?",why:"Assignment does not copy the collection: both names point to the same data. A change through b shows up in a.",analogy:"a and b are two keys to the same drawer. Whoever puts something in using key b changes what key a will find."},
k3:{title:"List or dictionary",prompt:"Mr Antônio wants to look up how many copies of a book exist by typing its title. Which structure fits best?",opts:["A dictionary (map) from title to quantity","A list of quantities in order of arrival","One variable per book","A single text with everything separated by commas"],hint:"Will the lookup be by position or by name?",why:"A dictionary ties key to value and looks up directly by key. With a list you would need to know the position or scan everything.",analogy:"A dictionary is a contacts list: you search by name and find the phone number, without reading the whole list."},
k4:{title:"One step past the end",prompt:"The loop tries to access a position that does not exist. Which line causes the problem?",hint:"With 3 elements, what is the largest valid index?",why:"The loop produces indexes 0, 1, 2 and 3, but 3 does not exist. The correct limit is the size of the collection, not included.",analogy:"It is the fence-post error: on a fence with 3 boards, whoever counts to 4 tries to nail a board that is not there."},
k5:{title:"How many books with more than four copies",prompt:"What does the program print?",hint:"c counts elements; it does not add values.",why:"Only 5 and 8 are greater than 4, so the counter ends at 2.",analogy:"It is the doorman with a hand clicker: one click per person who meets the rule, regardless of how tall each one is."},
r1:{title:"The brake of recursion",prompt:"What must every recursive function have so it does not call itself forever?",opts:["A base case, which answers without a new call","An inner while loop","A global control variable","At least two parameters"],hint:"Think about what makes the calls stop.",why:"The base case is the simple situation solved directly. Every recursive call must move towards it.",analogy:"Russian dolls: you open one, find a smaller one, and stop at the solid doll. Without it, you would open dolls forever."},
r2:{title:"Factorial step by step",prompt:"What does the program print?",hint:"Expand: fact(4) = 4 × fact(3) = ...",why:"4 × 3 × 2 × 1 = 24. Each call waits for the smaller call's answer and then multiplies.",analogy:"A queue of people asking the one in front \"what is your number?\". The first answers 1, and the answer travels back down the queue being multiplied."},
r3:{title:"Recursion that does not move",prompt:"The function should print n, n-1, ..., 1, but overflows the call stack. Which line is wrong?",hint:"Is the recursive call moving towards the base case?",why:"Calling count(n) repeats the same problem forever. The fix is count(n - 1), which walks down to zero.",analogy:"It is asking someone to go down the stairs while they keep stepping on the same step. The base case exists; it is just never reached."},
r4:{title:"Printing on the way back",prompt:"What does the program print?",hint:"The print comes after the recursive call. When does it finally run?",why:"Each call first goes down to the base case; printing only happens on return, from the innermost (1) to the outermost (3).",analogy:"A stack of plates: you stack 3, 2, 1 and only wash as you unstack. Last in is first washed."},
r5:{title:"Two calls at a time",prompt:"What does the program print?",hint:"Work bottom-up: f(0), f(1), f(2)...",why:"It is the Fibonacci sequence: 0, 1, 1, 2, 3, 5. So f(5) = 5.",analogy:"A family tree in reverse: each answer depends on the two before it, until you reach the known ancestors (the base cases)."},
q1:{title:"Functional or non-functional",prompt:"Which of these is a NON-functional requirement of the clinic system?",opts:["The system must respond within 2 seconds","The patient can reschedule an appointment","The system sends a text reminder","The receptionist registers patients"],hint:"Non-functional describes quality (how well), not behaviour (what it does).",why:"Response time is a quality attribute. The other three describe functions the system performs.",analogy:"In a car, functional is driving, braking and turning on the lights. Non-functional is the fuel economy, comfort and safety with which it does so."},
q2:{title:"A requirement you can test",prompt:"Which requirement is written in a verifiable way?",opts:["Search returns results in under 1 s for 95% of queries","The system must be fast","The interface must be friendly","The system must be modern and robust"],hint:"Ask yourself: how would I prove this was met?",why:"Only the first option has a measurable criterion. \"Fast\", \"friendly\" and \"modern\" turn into arguments at delivery time.",analogy:"It is the difference between asking the bricklayer for \"a tall wall\" and \"a 2.80 m wall\". Only the second can be checked with a tape measure."},
q3:{title:"A well-formed user story",prompt:"Which option follows the user story format?",opts:["As a patient, I want a reminder the day before, so that I do not miss my appointment","Create the appointments table with a foreign key to patient","The system must use React on the front end","Scheduling screen, version 2"],hint:"The format is: As a [role], I want [action], so that [benefit].",why:"The story says who needs it, what they need and why, without dictating the technical solution.",analogy:"It is an order at a restaurant: the customer names the dish and the hunger to satisfy, not the brand of pan the chef must use."},
q4:{title:"\"Just like the bank's\"",prompt:"The director asks for \"an app just like the bank's\". What is the best first step?",opts:["Ask which everyday problem she wants to solve","Start building the app right away","Refuse, because apps are expensive","Estimate the deadline and talk later"],hint:"She described a solution. What is the need behind it?",why:"Requests usually arrive as solutions. Understanding the real need (missed appointments) may reveal something simpler and more useful.",analogy:"The patient walks in asking for antibiotics; a good doctor first asks what they are feeling."},
q5:{title:"Validate before building",prompt:"Which technique validates requirements with the clinic's front desk before any coding?",opts:["Show a paper prototype of the screens and watch them use it","Deliver the finished system and collect complaints","Email the requirements document and wait","Ask only the director whether everything is fine"],hint:"Look for the cheapest option that puts the real user in front of the idea.",why:"Low-fidelity prototypes cost minutes and expose misunderstandings early, while fixing them is still cheap.",analogy:"A tailor does the fitting with pins before sewing. Moving a pin takes seconds; unpicking a seam costs the suit."},
a1:{title:"What a sprint is",prompt:"In Scrum, a sprint is:",opts:["A short, fixed-length cycle that delivers a usable increment","The final testing phase before launch","A 15-minute daily meeting","The document with all project requirements"],hint:"Think rhythm: repeated cycles with a delivery at the end.",why:"Sprints have a fixed length (usually 1 to 4 weeks) and end with something that works and can be evaluated.",analogy:"Just like this game: every 5 tickets you stop, look at what you delivered and adjust course, instead of judging everything only at the end."},
a2:{title:"What the daily is for",prompt:"What is the purpose of the daily meeting?",opts:["Synchronise the team and surface impediments","Report individually to management","Detail the technical solution of each task","Replan the whole product backlog"],hint:"It lasts about 15 minutes. What fits in that time?",why:"The daily aligns the team towards the sprint goal and exposes blockers early. Long discussions continue afterwards, with only those involved.",analogy:"It is the team's quick huddle at half-time: who marks whom and where the problem is. The full team talk is for another moment."},
a3:{title:"The enrolment MVP",prompt:"What would be a good MVP for the school?",opts:["Online enrolment working end to end, without report cards or meals","All screens designed but none working","The complete system, delivered in six months","Only the database, with no screen at all"],hint:"An MVP is the smallest version that already solves the core problem for real users.",why:"The MVP delivers value end to end at small scale and lets you learn from real use before investing in the rest.",analogy:"Someone who wants to get from A to B does not receive a wheel first and then a chassis. They get a skateboard, then a bicycle, then a car: every stage already moves them."},
a4:{title:"It will not fit in the sprint",prompt:"Two days before the sprint ends, the team realises it will not deliver everything. What is the best move?",opts:["Renegotiate scope with the Product Owner, keeping quality","Skip the tests to deliver everything","Extend the sprint without telling anyone","Work overtime in silence until it fits"],hint:"In agile, deadline and quality are fixed. What is flexible?",why:"Scope is the adjustment variable. Cutting quality creates technical debt, and hiding the problem breaks transparency.",analogy:"A packed restaurant: better to take one dish off tonight's menu than to serve raw chicken to every table."},
a5:{title:"Everything started, nothing finished",prompt:"The team board has 12 tasks \"in progress\" for 3 people, and nothing gets done. Which Kanban practice tackles this?",opts:["Limiting work in progress (WIP)","Adding more columns to the board","Holding longer meetings","Making the sprint longer"],hint:"The bottleneck is not starting; it is finishing.",why:"Limiting WIP forces finishing before starting, cuts context switching and makes bottlenecks visible.",analogy:"A four-burner stove with 12 pans: nothing cooks properly. Better to finish four dishes and only then put the next ones on."},
g1:{title:"What a commit is",prompt:"A Git commit is:",opts:["A record of the project's state at that moment, with a message","Uploading the files to the server","A backup copy in another folder","Deleting old versions"],hint:"Sending to the server is a different command (push).",why:"A commit saves a local snapshot of the changes, with author, date and message. Sending it to the remote happens later, with push.",analogy:"It is a save point in a game: if the boss beats you, you can return to exactly that moment."},
g2:{title:"Publishing a fix",prompt:"Order the commands to create a branch, record the change and send it to the remote repository.",hint:"First the workspace, then stage (add), record (commit) and send (push).",why:"You create the branch before changing; add picks what goes in; commit records; push publishes.",analogy:"Sending a parcel: get the box (branch), put the items in (add), seal and label it (commit), and only then take it to the post office (push)."},
g3:{title:"What a branch is for",prompt:"Why should Bia create a branch for the new discounts screen?",opts:["To work in isolation without affecting the main line","To make the repository faster","Because Git forbids commits on main","To erase the old history"],hint:"Think about what happens if unfinished code goes straight to main.",why:"A branch isolates work in progress. Main stays stable until the change is reviewed and integrated.",analogy:"It is the draft of a document: you experiment freely and only copy it into the original when the text is good."},
g4:{title:"Why the merge conflicted",prompt:"When does a merge conflict happen?",opts:["When two branches change the same lines in different ways","Whenever two people work in the same repository","When the branch has more than ten commits","When a new file is created on one of the branches"],hint:"Git merges changes in different places on its own. What can it not decide?",why:"If both versions touched the same spot, Git does not know which to pick and asks for a human decision.",analogy:"Two people rewrote the same sentence of a contract. The notary does not choose alone: both are called in to settle the final wording."},
g5:{title:"A good commit message",prompt:"Which commit message is most useful to someone reading the history a year from now?",opts:["Fix discount calculation for purchases of exactly R$ 50","tweaks","final version this time for real","Changes made by Caio on Friday"],hint:"The message should say what changed and why, without forcing anyone to open the code.",why:"A good message describes the change and its reason. \"tweaks\" does not help locate when a behaviour changed.",analogy:"It is the label on moving boxes: \"kitchen, fragile glasses\" saves you opening twenty boxes marked \"stuff\"."},
t1:{title:"What a unit test is",prompt:"A unit test checks:",opts:["A small isolated unit of code, such as a function","The whole system through the user interface","Whether the server can handle heavy traffic","Whether the client was happy with the delivery"],hint:"The name gives it away: what is the \"unit\"?",why:"Unit tests are small, fast and isolated. The whole system is end-to-end testing; heavy traffic is load testing.",analogy:"It is testing each bulb before assembling the string of lights. If the set fails later, you already know the bulbs are not the problem."},
t2:{title:"Choosing test values",prompt:"The rule applies \"from 18\". Which set of inputs tests the function best?",hint:"Where do comparison mistakes (> instead of >=) tend to hide?",why:"Defects cluster at boundaries. Testing just below, exactly at and just above the limit exposes a >= swapped for >.",analogy:"To check whether a door closes well, you inspect the frame, not the middle of the wall."},
t3:{title:"Arrange, act, assert",prompt:"Assemble the bakery discount test following arrange, act, assert.",hint:"First the data, then the call to the function under test, and finally the check.",why:"The test sets up the scenario, performs the action and compares the result with what was expected.",analogy:"Like trying out a recipe: lay out the ingredients, cook, and only then taste to see if it came out right."},
t4:{title:"All green, zero bugs?",prompt:"All 200 tests passed and coverage is 100%. Can you claim the software has no defects?",opts:["No: tests reveal the presence of defects, they do not prove absence","Yes: 100% coverage guarantees it","Yes, as long as the tests are unit tests","No, because 200 tests is too few; 1000 would do"],hint:"Coverage measures lines executed, not situations verified.",why:"Coverage says the lines ran, not that every combination of inputs and requirements was checked. It is Dijkstra's classic remark.",analogy:"A silent smoke alarm means there is no smoke right now, not that the wiring of the whole house is sound."},
t5:{title:"The discount bug must not return",prompt:"You found the cause of the R$ 50 bug. What is the best sequence?",opts:["Write a test that reproduces the bug, fix it and keep the test","Fix it straight in production and tell Dona Lúcia","Fix it and test manually once","Write the bug down in a document to remember later"],hint:"How do you ensure nobody reintroduces the same mistake six months from now?",why:"A regression test fails before the fix, passes after it and stands guard forever.",analogy:"It is a vaccine: the system meets the invader once and recognises it every time it tries to come back."},
d1:{title:"The class that does everything",prompt:"The Report class computes totals, renders the PDF and sends the email. Which principle does it break?",opts:["Single responsibility (SRP)","Liskov substitution (LSP)","Dependency inversion (DIP)","None: keeping everything together eases maintenance"],hint:"How many different reasons are there to change this class?",why:"It changes if the calculation rule, the PDF layout or the mail server changes. Three reasons point to three responsibilities.",analogy:"A Swiss army knife is handy when camping, but in a professional kitchen each knife has its job, and sharpening one does not ruin the others."},
d2:{title:"A 300-line function",prompt:"The charging function repeats the same validation block in three places. What is the best refactoring?",opts:["Extract the repeated block into a clearly named function","Add comments explaining each repetition","Split the file in two, keeping the function","Leave it as is, because it works"],hint:"Think of the DRY principle: don't repeat yourself.",why:"Extracting a function removes duplication: a fix is made in one place only, and the name documents the intent.",analogy:"Instead of rewriting the address on every letter, you make a stamp. Address changed? Replace the stamp, not all the letters."},
d3:{title:"Cohesion and coupling",prompt:"In a good module design, you aim for:",opts:["High cohesion and low coupling","Low cohesion and high coupling","High cohesion and high coupling","It does not matter, as long as tests pass"],hint:"Cohesion is the module's inner focus; coupling is how much it depends on others.",why:"Focused modules that depend little on each other can be understood, tested and replaced in isolation.",analogy:"LEGO bricks: each has a well-defined shape (cohesion) and a simple, standard connector (low coupling)."},
d4:{title:"One more \"if\" in payments",prompt:"Every new payment method means editing this function. Which design change solves it best?",opts:["Create a Payment interface and one implementation per method","Add the new \"if\" and a comment","Copy the whole function for each payment method","Replace the chain of conditions with a while loop"],hint:"Open/closed principle: open for extension, closed for modification.",why:"With polymorphism (Strategy pattern), a new payment method becomes a new module, without touching code that already works and has been tested.",analogy:"It is the standard power socket: any new appliance plugs in without anyone breaking the wall and redoing the wiring."},
d5:{title:"The database welded into the class",prompt:"The Order class creates its own connection to a specific MySQL database. What does that make harder, and how do you fix it?",opts:["Testing and swapping the database; receive the dependency ready-made, through an interface","Nothing; creating the connection inside is the tidiest way","Speed; fix it with a more powerful server","Readability; fix it with more comments"],hint:"How would you test Order without a running MySQL?",why:"Creating the concrete dependency internally couples the class to it. With dependency injection, the class receives something that fulfils an interface, and in tests it receives a stand-in.",analogy:"A lamp with the bulb welded in: when it burns out, you throw everything away. With a standard socket you replace only the bulb, even with a test bulb."}
}
};

skills:{
var:{name:"Variables",about:"Guardar valores, tipos y operadores básicos.",client:"Panadería de doña Lúcia",title:"La caja que nunca cuadra",
 story:"Todas las noches doña Lúcia cierra la caja de la panadería en un cuaderno, y la cuenta nunca cuadra. Su sobrino armó una planilla, pero el precio del pan quedó escrito como texto y la suma de dos panes dio \"4.504.50\". Ella pide algo sencillo: registrar precio, cantidad y vuelto sin errores. Antes de cualquier pantalla bonita, el sistema tiene que guardar cada dato con el tipo correcto.",
 theory:[["Una variable es un nombre para un valor","Guarda un dato en memoria para usarlo después. Asignar copia el valor de ese instante; no crea un vínculo permanente entre dos variables."],
  ["Todo valor tiene un tipo","Enteros, decimales, texto y booleanos se comportan distinto. Con texto, el + une; con números, suma. El dinero pide decimal; la cantidad pide entero."],
  ["División entera y resto","La división entera descarta la parte decimal, y el operador % devuelve lo que sobra. Son la base para calcular el vuelto, la paridad y el reparto en grupos."]]},
cond:{name:"Condicionales",about:"Decidir el camino del programa con if, else if y else.",client:"Centro de salud del barrio",title:"La fila que no puede ser por orden de llegada",
 story:"En el centro de salud, la enfermera Rosa hace el triaje de memoria: fiebre alta pasa primero, los adultos mayores tienen prioridad, el resto espera. Cuando ella falta, la fila se vuelve por orden de llegada y un caso grave espera dos horas. El centro quiere que el sistema aplique las mismas reglas de Rosa, siempre, también en los casos límite, como una fiebre de exactamente 39 grados.",
 theory:[["Una condición es una pregunta de sí o no","El programa evalúa una expresión booleana y sigue un único camino. Operadores como >, >= y == definen exactamente dónde está el límite."],
  ["El orden de las pruebas importa","En una cadena if / else if, gana la primera prueba verdadera y las demás ni se evalúan. La regla más estricta debe ir primero."],
  ["Combinar condiciones","Y (and, &&) exige que ambas sean verdaderas; O (or, ||) exige al menos una. El Y se evalúa antes que el O; ante la duda, usa paréntesis."]]},
loop:{name:"Bucles",about:"Repetir instrucciones con for y while.",client:"Escuela Municipal Paulo Freire",title:"Cuatrocientas libretas a mano",
 story:"Marta, la secretaria, calcula el promedio de 400 alumnos con la calculadora, uno por uno, cada bimestre. Le lleva tres días y siempre se cuela un error. El cálculo es el mismo para todos; solo cambian las notas. Es el retrato de una tarea que pide repetición automática: escribir la regla una vez y dejar que la computadora recorra la lista entera.",
 theory:[["for: repetir para cada elemento","Úsalo cuando se conoce la cantidad de repeticiones: cada alumno de la lista, cada número de 0 a n-1. El conteo suele empezar en 0 y detenerse antes del límite."],
  ["while: repetir mientras algo sea verdadero","Úsalo cuando no se sabe cuántas vueltas habrá. Algo dentro del bucle tiene que avanzar hacia la salida; si no, nunca termina."],
  ["El patrón acumulador","Una variable arranca con un valor neutro (0, vacío, primer elemento) y se actualiza en cada vuelta: suma, conteo, valor máximo."]]},
func:{name:"Funciones",about:"Empaquetar lógica: parámetros, retorno y alcance.",client:"Cooperativa de reparto Roda Viva",title:"El envío calculado en tres lugares",
 story:"La cooperativa de repartidores calcula el envío en el sitio web, en la aplicación y en la planilla de finanzas. Cuando subió el precio por kilómetro, alguien actualizó solo dos de los tres lugares, y durante una semana los repartidores cobraron menos de lo que les correspondía. La regla es una sola; tiene que vivir en un único lugar y que todos la llamen.",
 theory:[["Una función es una regla con nombre","Recibe parámetros, ejecuta pasos y devuelve un resultado con return. Definir una vez y llamar desde todas partes elimina las copias que se desincronizan."],
  ["Devolver no es imprimir","Imprimir muestra el valor en pantalla; devolver se lo entrega a quien llamó, que puede usarlo en otros cálculos."],
  ["Alcance y paso por valor","Las variables creadas dentro de la función son locales y desaparecen al terminar. Los números que se pasan como argumento llegan como copia: cambiarlos adentro no cambia el original."]]},
col:{name:"Colecciones",about:"Listas y diccionarios, índices y referencias.",client:"Biblioteca comunitaria Casa das Letras",title:"Se perdió el cuaderno de préstamos",
 story:"La biblioteca comunitaria anotaba los préstamos en un cuaderno, que se empapó en la última lluvia. Don Antônio quiere saber qué libros hay, cuántos ejemplares de cada uno y quién tiene cuál. Son muchos datos del mismo tipo: guardarlos en variables sueltas es imposible. Es hora de organizar los datos en colecciones.",
 theory:[["Lista: secuencia ordenada","Guarda varios valores a los que se accede por posición. El índice empieza en 0, así que una lista de 3 elementos va del índice 0 al 2."],
  ["Diccionario o mapa: búsqueda por clave","Asocia una clave con un valor, como título con ejemplares. Es la opción correcta cuando se busca por nombre y no por posición."],
  ["Las colecciones se comparten por referencia","Asignar una lista a otra variable no copia los datos: los dos nombres apuntan a la misma colección. Para duplicarla hay que copiarla de forma explícita."]]},
rec:{name:"Recursión",about:"Funciones que se llaman a sí mismas y el caso base.",client:"Notaría del 2.º Distrito",title:"Carpetas dentro de carpetas dentro de carpetas",
 story:"La notaría digitalizó 40 años de documentos en carpetas dentro de carpetas, sin una profundidad fija. Helena, la escribiente, necesita contar cuántos archivos hay en total. Un bucle simple no alcanza, porque cada carpeta puede contener otras. La solución natural es: contar los archivos de esta carpeta y repetir el mismo procedimiento en cada subcarpeta.",
 theory:[["Un problema definido en términos de sí mismo","La función resuelve un pedazo pequeño y delega el resto en una llamada a sí misma sobre un problema menor."],
  ["Caso base: el freno","Es la situación simple que se responde sin una nueva llamada (carpeta vacía, n igual a 0). Toda llamada recursiva tiene que acercarse a él."],
  ["La pila de llamadas","Cada llamada queda esperando a que termine la siguiente. Lo que viene después de la llamada recursiva solo se ejecuta a la vuelta, de la más interna a la más externa."]]},
req:{name:"Requisitos",about:"Descubrir y escribir lo que el software tiene que hacer.",client:"Centro de salud del barrio",title:"\"Quiero una aplicación\"",
 story:"La directora del centro llega decidida a la reunión: \"quiero una aplicación igual a la del banco\". Tras media hora de conversación aparece el problema real: los pacientes faltan a las consultas porque olvidan la fecha, y se pierde el 30% de los turnos. Tal vez la solución sea un simple recordatorio por mensaje. Quien construye lo que le pidieron, sin entender lo que hace falta, entrega el software equivocado en la fecha correcta.",
 theory:[["La necesidad va antes que la solución","Los clientes describen soluciones; el ingeniero investiga el problema que hay detrás con entrevistas, observación y prototipos (elicitación)."],
  ["Funcional y no funcional","Funcional es lo que el sistema hace (agendar, recordar). No funcional es qué tan bien lo hace (tiempo de respuesta, seguridad, disponibilidad)."],
  ["Un buen requisito es verificable","\"Rápido\" y \"amigable\" no se pueden probar. \"Responde en menos de 2 s en el 95% de las consultas\" sí. Las historias de usuario siguen: Como [rol], quiero [acción], para [beneficio]."]]},
agil:{name:"Ágil",about:"Sprints, MVP y entrega incremental.",client:"Escuela Municipal Paulo Freire",title:"Las inscripciones abren en seis semanas",
 story:"La escuela quiere un sistema completo de inscripciones, con libretas, comedor y transporte. Las inscripciones abren en seis semanas, y la lista de deseos llevaría seis meses. Si el equipo desaparece y vuelve recién con todo listo, llegará tarde. La salida es entregar primero lo esencial funcionando, la inscripción, y crecer a partir del uso real.",
 theory:[["Entregar en ciclos cortos","Un sprint tiene duración fija y termina con un incremento utilizable. Los comentarios de quienes lo usan orientan el ciclo siguiente."],
  ["MVP: aprender temprano","El producto mínimo viable resuelve el problema central de punta a punta, a pequeña escala, para validar hipótesis antes de invertir más."],
  ["El alcance es la variable de ajuste","Plazo y calidad quedan fijos; se negocia qué entra. Limitar el trabajo en curso ayuda al equipo a terminar antes de empezar algo nuevo."]]},
git:{name:"Git",about:"Versionar código: commits, ramas y merges.",client:"El equipo de Ponte",title:"El viernes en que desapareció el código",
 story:"El viernes por la tarde, Caio y Bia editaron el mismo archivo del sistema de la panadería. Cada uno guardó su versión en la carpeta compartida como \"final_ahora_si.zip\". La última copia borró el trabajo del otro, y nadie sabía decir qué versión estaba en producción. Ponte tomó una decisión: desde el lunes, todo el código vive en un repositorio Git.",
 theory:[["Commit: una foto con leyenda","Registra el estado del proyecto con autor, fecha y mensaje. Los mensajes claros cuentan qué cambió y por qué."],
  ["Rama: trabajar en paralelo","Cada funcionalidad nace en una rama aislada, y la línea principal se mantiene estable hasta la revisión y la integración (merge)."],
  ["Un conflicto es un pedido de decisión","Si dos ramas cambian las mismas líneas, Git no elige solo: muestra las dos versiones y pide que alguien decida."]]},
test:{name:"Pruebas",about:"Verificar el código con pruebas automatizadas.",client:"Panadería de doña Lúcia",title:"El descuento que cobró de más",
 story:"La panadería lanzó un 10% de descuento para compras desde 50 reales. Un cliente gastó exactamente 50 y no recibió el descuento; a otro se lo aplicaron dos veces. Doña Lúcia devolvió dinero toda la semana. El error estaba en una comparación de límite que nadie probó. Una prueba automatizada de tres líneas habría avisado antes que el cliente.",
 theory:[["Prueba unitaria","Verifica una unidad pequeña y aislada, como una función, de forma rápida y repetible. El patrón es preparar, actuar y verificar (Arrange, Act, Assert)."],
  ["Valores límite","Los defectos se concentran en los bordes de las reglas. Prueba justo por debajo, exactamente en el límite y justo por encima."],
  ["Pruebas de regresión y límites de las pruebas","Cada error corregido gana una prueba que lo reproduce, para que no vuelva nunca. Las pruebas revelan la presencia de defectos, pero no demuestran su ausencia."]]},
design:{name:"Diseño",about:"Cohesión, acoplamiento, SOLID y refactorización.",client:"Cooperativa de reparto Roda Viva",title:"Otro medio de pago, otro parche",
 story:"La cooperativa aceptaba efectivo; después llegó la tarjeta, luego el pago instantáneo Pix, ahora los vales de comida. Con cada novedad, alguien agrega otro \"si\" a una función de 300 líneas que todos tienen miedo de tocar. En el último cambio, Pix dejó de funcionar dos días. El software funciona, pero se volvió caro de cambiar. Es un problema de diseño.",
 theory:[["Alta cohesión, bajo acoplamiento","Cada módulo se ocupa de un tema y depende poco de los demás. Así se puede entender, probar y reemplazar por separado."],
  ["Principios SOLID","Responsabilidad única: un motivo para cambiar. Abierto/cerrado: extender sin editar lo que ya funciona. Inversión de dependencias: depender de interfaces, no de implementaciones concretas."],
  ["Refactorizar","Mejorar la estructura sin cambiar el comportamiento, en pasos pequeños y protegidos por pruebas: extraer función, eliminar duplicación, poner nombres claros."]]}
},
items:{
v1:{title:"La etiqueta que cambió de lugar",prompt:"Doña Lúcia copió el precio viejo antes de subirlo. ¿Qué imprime el programa?",hint:"Ve línea por línea: ¿cuánto valía x en el momento en que y lo recibió?",why:"y recibe una copia del valor que x tenía en ese instante (5). Cambiar x después no afecta a y.",analogy:"Una variable es una etiqueta pegada a un valor. y recibió su propia etiqueta en el 5; mover la etiqueta x al 8 no toca la de y."},
v2:{title:"La suma que no suma",prompt:"Fue el error de la planilla del sobrino. ¿Qué imprime el programa?",hint:"Fíjate en las comillas: ¿esos valores son números o texto?",why:"Entre comillas, 3 y 4 son texto. Con texto, la operación une en lugar de sumar.",analogy:"Los textos son collares de cuentas: unir dos collares da un collar más largo, no una suma. Para sumar, primero hay que convertir a número."},
v3:{title:"Un intercambio que pierde un valor",prompt:"El código debería intercambiar a y b, pero imprime 2 2. ¿En qué línea se pierde el valor original de a?",hint:"¿Después de qué línea el número 1 deja de existir en todas las variables?",why:"Cuando a recibe b, el 1 se sobrescribe sin haberse guardado. El intercambio correcto usa una variable temporal.",analogy:"Para intercambiar el contenido de dos vasos hace falta un tercero. Volcar uno directo en el otro pierde una de las bebidas."},
v4:{title:"Repartiendo el vuelto",prompt:"Siete monedas repartidas entre dos cajas. ¿Qué imprime el programa?",hint:"La división entera descarta la parte decimal; % devuelve lo que sobra.",why:"La división entera de 7 entre 2 da 3, y el resto es 1.",analogy:"Repartir 7 caramelos entre 2 niños: a cada uno le tocan 3 y sobra 1 en la mesa."},
v5:{title:"El tipo correcto para el precio",prompt:"¿Qué tipo de dato es el más adecuado para guardar el precio 4.50 de un pan?",opts:["Número decimal (punto flotante)","Número entero","Texto","Booleano"],hint:"El valor tiene centavos y se va a usar en cuentas.",why:"Un precio tiene decimales y entra en cálculos, así que pide un tipo numérico decimal. Como texto no se podría sumar; como entero perdería los centavos.",analogy:"Es elegir el recipiente adecuado: el agua va en botella, no en colador. Cada tipo de dato se hizo para una clase de contenido."},
c1:{title:"Fiebre de exactamente 39",prompt:"Una regla límite del triaje. ¿Qué imprime el programa?",hint:">= significa mayor O igual.",why:"7 >= 7 es verdadero, así que solo se ejecuta el primer bloque y el else se ignora.",analogy:"if/else es una bifurcación en la ruta: el auto sigue por un solo lado, nunca por los dos."},
c2:{title:"El orden de las reglas de Rosa",prompt:"Las reglas se escribieron en este orden. ¿Qué imprime el programa?",hint:"Cuando una prueba de la cadena es verdadera, las siguientes ni se evalúan.",why:"30 > 20 ya es verdadero, así que solo se imprime A. La condición más estricta (t > 28) debería ir primero.",analogy:"Es una fila de molinetes: quien pasó el primero no intenta los demás. El molinete más exigente tiene que ir adelante."},
c3:{title:"Turno par o impar",prompt:"El centro llama los turnos pares a la ventanilla 1 y los impares a la 2. Arma el programa que clasifica el número.",hint:"Primero existe el dato; después viene la prueba del resto de dividir entre 2.",why:"El dato tiene que existir antes de la prueba. Resto cero al dividir entre 2 indica par; el else cubre todo lo demás.",analogy:"Como en el triaje: primero llega el paciente, después viene la pregunta, y cada respuesta lleva a una sala."},
c4:{title:"Quién va primero: Y u O",prompt:"¿El resultado de la expresión es verdadero o falso?",opts:["Verdadero","Falso","Da error","Depende del lenguaje"],hint:"Así como la multiplicación va antes que la suma, uno de los operadores lógicos se evalúa primero.",why:"El Y tiene precedencia sobre el O. Primero falso Y falso da falso; luego verdadero O falso da verdadero. Vale en los cuatro lenguajes del juego.",analogy:"Igual que 2 + 3 × 0: primero resuelves la multiplicación. El Y es la multiplicación de la lógica; ante la duda, usa paréntesis."},
c5:{title:"Sesenta años y sin descuento",prompt:"Quienes tienen exactamente 60 años deberían pagar la mitad, pero pagan entero. ¿Qué línea hay que corregir?",hint:"Pruébalo mentalmente con 60: ¿la condición es verdadera?",why:"60 > 60 es falso. La regla \"desde los 60\" pide >=. Los errores de límite están entre los más comunes en condicionales.",analogy:"Es el cartel \"altura mínima 1.40 m\" con un guardia que frena a quien mide exactamente 1.40. La regla está bien; la comparación, mal."},
l1:{title:"Desde dónde se cuenta",prompt:"¿Qué valores imprime el bucle?",hint:"El conteo empieza en 0 y se detiene antes de 3.",why:"Se generan 0, 1 y 2: tres valores, empezando en cero y sin incluir el 3.",analogy:"Como los pisos de un edificio que empieza en planta baja (0): tres plantas van del 0 al 2."},
l2:{title:"Sumando las notas",prompt:"¿Qué imprime el programa?",hint:"El bucle incluye el 1 y excluye el 5.",why:"El bucle recorre 1, 2, 3 y 4, y la suma es 10. El límite final queda afuera.",analogy:"total es una alcancía: en cada vuelta cae una moneda con el valor de i. Al final cuentas lo que hay adentro."},
l3:{title:"Cuenta regresiva sin fin",prompt:"El código debería imprimir 3, 2, 1 y después \"end\", pero nunca termina. ¿Qué línea hay que corregir?",hint:"Para que el bucle pare, n > 0 tiene que volverse falso en algún momento.",why:"Sumar 1 aleja a n de cero, así que la condición siempre es verdadera. Lo correcto es restar 1.",analogy:"Es bajar una escalera subiendo un escalón en cada paso: nunca llegas al piso. Todo while tiene que avanzar hacia la salida."},
l4:{title:"La nota más alta del curso",prompt:"Marta quiere la nota más alta de la lista. Arma el programa.",hint:"Empieza suponiendo que la primera es la más alta; después compara con cada una.",why:"El patrón es: suposición inicial (primer elemento), recorrer todo, cambiar al campeón cuando aparece uno mayor e imprimir recién después del bucle.",analogy:"Es el \"rey de la colina\": el primero sube a la cima y cada retador solo lo desplaza si es mayor. Quien esté ahí al final es el máximo."},
l5:{title:"Cuántas veces se puede dividir a la mitad",prompt:"¿Qué imprime el programa?",hint:"Sigue a n en cada vuelta: 16, 8, ...",why:"n pasa por 8, 4, 2 y 1: cuatro divisiones hasta que n > 1 se vuelve falso.",analogy:"Doblar una hoja a la mitad una y otra vez: el while no sabe de antemano cuántos dobleces habrá; simplemente para cuando ya no se puede."},
f1:{title:"Usar el valor devuelto",prompt:"¿Qué imprime el programa?",hint:"return le entrega el resultado a quien llamó a la función.",why:"La función devuelve 8, que se guarda en r. Después, 8 + 1 = 9.",analogy:"Una función es una juguera: entra la fruta (argumento) y sale el vaso (valor de retorno), que usas como quieras."},
f2:{title:"Imprimir no es devolver",prompt:"Una función calcula el costo de envío y solo lo imprime, sin devolverlo. ¿Qué consecuencia tiene?",opts:["Quien la llamó no puede usar el valor en otros cálculos","Ninguna: imprimir y devolver son equivalentes","La función se vuelve más rápida","El valor pasa a ser global automáticamente"],hint:"¿A dónde va un valor impreso? ¿Y uno devuelto?",why:"Imprimir manda el valor a la pantalla y nada más. Devolver se lo entrega al código que llamó, que puede sumarlo, guardarlo o pasarlo a otro.",analogy:"Imprimir es mostrar el plato en la vitrina; devolver es entregárselo al cliente. Quien solo miró la vitrina se va con las manos vacías."},
f3:{title:"La x de adentro y la x de afuera",prompt:"¿Qué imprime el programa?",hint:"¿La variable creada dentro de la función es la misma que la de afuera?",why:"x = 99 es una variable local que existe solo durante la llamada. La x de afuera sigue valiendo 10.",analogy:"La función es una sala con su propia pizarra. Lo que se escribe adentro se borra al salir y no cambia la pizarra del pasillo."},
f4:{title:"Una función para el promedio",prompt:"Arma la función que calcula el promedio de una lista y la llamada que imprime el resultado.",hint:"Dentro de la función: pon el total en cero, acumula en el bucle y recién entonces devuelve la división.",why:"El return va después del bucle; si no, la función saldría en la primera vuelta. La llamada va después de la definición.",analogy:"Una receta de torta: primero el nombre de la receta, después los pasos en orden, y se sirve recién al final. No se puede servir a mitad del batido."},
f5:{title:"El argumento es una copia",prompt:"¿Qué imprime el programa?",hint:"¿La función recibe la variable x o una copia de su valor?",why:"Los números se pasan por valor: n es una copia de x. Cambiar n dentro de la función no cambia x, que sigue valiendo 5.",analogy:"Entregas una fotocopia del documento. Pueden rayarla todo lo que quieran: el original en tu cajón sigue intacto."},
k1:{title:"Los índices empiezan en cero",prompt:"¿Qué imprime el programa?",hint:"El primer elemento está en el índice 0.",why:"Los índices son 0 (10), 1 (20) y 2 (30).",analogy:"El índice es la distancia al inicio de la fila: el primero está a 0 pasos, el segundo a 1 paso."},
k2:{title:"Dos variables, una sola lista",prompt:"¿Qué imprime el programa?",hint:"¿La segunda variable es una colección nueva u otro nombre para la misma?",why:"La asignación no copia la colección: los dos nombres apuntan a los mismos datos. Un cambio hecho por b se ve en a.",analogy:"a y b son dos llaves del mismo cajón. Quien guarda algo con la llave b cambia lo que va a encontrar la llave a."},
k3:{title:"Lista o diccionario",prompt:"Don Antônio quiere consultar cuántos ejemplares hay de un libro escribiendo el título. ¿Qué estructura conviene más?",opts:["Un diccionario (mapa) de título a cantidad","Una lista de cantidades por orden de llegada","Una variable por cada libro","Un único texto con todo separado por comas"],hint:"¿La búsqueda será por posición o por nombre?",why:"El diccionario asocia clave con valor y busca directo por la clave. Con una lista habría que saber la posición o recorrerla entera.",analogy:"Un diccionario es una agenda de contactos: buscas por el nombre y encuentras el teléfono, sin leer la agenda completa."},
k4:{title:"Un paso más allá del final",prompt:"El bucle intenta acceder a una posición que no existe. ¿Qué línea causa el problema?",hint:"Con 3 elementos, ¿cuál es el mayor índice válido?",why:"El bucle genera los índices 0, 1, 2 y 3, pero el 3 no existe. El límite correcto es el tamaño de la colección, sin incluirlo.",analogy:"Es el error del poste de más: en una cerca de 3 tablas, quien cuenta hasta 4 intenta clavar una tabla que no existe."},
k5:{title:"Cuántos libros con más de cuatro ejemplares",prompt:"¿Qué imprime el programa?",hint:"c cuenta elementos; no suma los valores.",why:"Solo 5 y 8 son mayores que 4, así que el contador termina en 2.",analogy:"Es el portero con un contador de mano: un clic por cada persona que cumple la regla, sin importar cuánto mide cada una."},
r1:{title:"El freno de la recursión",prompt:"¿Qué necesita toda función recursiva para no llamarse a sí misma para siempre?",opts:["Un caso base, que responde sin una nueva llamada","Un bucle while interno","Una variable global de control","Al menos dos parámetros"],hint:"Piensa en qué hace que las llamadas se detengan.",why:"El caso base es la situación simple que se resuelve directamente. Toda llamada recursiva tiene que acercarse a él.",analogy:"Muñecas rusas: abres una, encuentras otra más chica, y paras al llegar a la muñeca maciza. Sin ella, abrirías muñecas para siempre."},
r2:{title:"Factorial paso a paso",prompt:"¿Qué imprime el programa?",hint:"Expande: fact(4) = 4 × fact(3) = ...",why:"4 × 3 × 2 × 1 = 24. Cada llamada espera la respuesta de la llamada menor y luego multiplica.",analogy:"Una fila de personas que le preguntan a la de adelante \"¿cuál es tu número?\". La primera responde 1, y la respuesta vuelve por la fila multiplicándose."},
r3:{title:"Recursión que no avanza",prompt:"La función debería imprimir n, n-1, ..., 1, pero desborda la pila de llamadas. ¿Qué línea está mal?",hint:"¿La llamada recursiva se está acercando al caso base?",why:"Llamar a count(n) repite el mismo problema para siempre. Lo correcto es count(n - 1), que avanza hasta cero.",analogy:"Es pedirle a alguien que baje la escalera mientras pisa siempre el mismo escalón. El caso base existe; solo que nunca se alcanza."},
r4:{title:"Imprimir a la vuelta",prompt:"¿Qué imprime el programa?",hint:"La impresión viene después de la llamada recursiva. ¿Cuándo se ejecuta por fin?",why:"Cada llamada primero baja hasta el caso base; las impresiones ocurren recién al volver, de la más interna (1) a la más externa (3).",analogy:"Una pila de platos: apilas 3, 2, 1 y lavas recién al desapilar. El último en entrar es el primero en lavarse."},
r5:{title:"Dos llamadas a la vez",prompt:"¿Qué imprime el programa?",hint:"Calcula de abajo hacia arriba: f(0), f(1), f(2)...",why:"Es la sucesión de Fibonacci: 0, 1, 1, 2, 3, 5. Por lo tanto, f(5) = 5.",analogy:"Un árbol genealógico al revés: cada respuesta depende de las dos anteriores, hasta llegar a los antepasados conocidos (los casos base)."},
q1:{title:"Funcional o no funcional",prompt:"¿Cuál de estos es un requisito NO funcional del sistema del centro de salud?",opts:["El sistema debe responder en menos de 2 segundos","El paciente puede reprogramar la consulta","El sistema envía un recordatorio por mensaje","La recepcionista registra pacientes"],hint:"No funcional describe calidad (qué tan bien), no comportamiento (qué hace).",why:"El tiempo de respuesta es un atributo de calidad. Los otros tres describen funciones que el sistema ejecuta.",analogy:"En un auto, funcional es andar, frenar y prender las luces. No funcional es el consumo, la comodidad y la seguridad con que lo hace."},
q2:{title:"Un requisito que se puede probar",prompt:"¿Qué requisito está escrito de forma verificable?",opts:["La búsqueda devuelve resultados en menos de 1 s en el 95% de las consultas","El sistema debe ser rápido","La interfaz debe ser amigable","El sistema debe ser moderno y robusto"],hint:"Pregúntate: ¿cómo demostraría que esto se cumplió?",why:"Solo la primera opción tiene un criterio medible. \"Rápido\", \"amigable\" y \"moderno\" terminan en discusión a la hora de la entrega.",analogy:"Es la diferencia entre pedirle al albañil \"una pared alta\" y \"una pared de 2.80 m\". Solo la segunda se puede comprobar con la cinta métrica."},
q3:{title:"Una historia de usuario bien armada",prompt:"¿Qué opción sigue el formato de historia de usuario?",opts:["Como paciente, quiero recibir un recordatorio el día anterior, para no perder mi consulta","Crear la tabla consultas con clave foránea a paciente","El sistema debe usar React en el front-end","Pantalla de turnos, versión 2"],hint:"El formato es: Como [rol], quiero [acción], para [beneficio].",why:"La historia dice quién lo necesita, qué necesita y por qué, sin imponer la solución técnica.",analogy:"Es un pedido en el restaurante: el cliente dice el plato y el hambre que quiere saciar, no la marca de olla que debe usar el chef."},
q4:{title:"\"Igual a la del banco\"",prompt:"La directora pide \"una aplicación igual a la del banco\". ¿Cuál es el mejor primer paso?",opts:["Preguntarle qué problema del día a día quiere resolver","Empezar la aplicación de inmediato","Negarse, porque las aplicaciones son caras","Estimar el plazo y conversar después"],hint:"Ella describió una solución. ¿Qué necesidad hay detrás?",why:"Los pedidos suelen llegar como soluciones. Entender la necesidad real (las ausencias a las consultas) puede revelar algo más simple y más útil.",analogy:"El paciente llega pidiendo antibióticos; el buen médico primero le pregunta qué siente."},
q5:{title:"Validar antes de construir",prompt:"¿Qué técnica valida los requisitos con la recepción del centro antes de programar?",opts:["Mostrar un prototipo en papel de las pantallas y observar cómo lo usan","Entregar el sistema terminado y juntar los reclamos","Enviar el documento de requisitos por correo y esperar","Preguntarle solo a la directora si está todo bien"],hint:"Busca la opción más barata que pone al usuario real frente a la idea.",why:"Los prototipos de baja fidelidad cuestan minutos y sacan a la luz los malentendidos temprano, cuando corregir todavía es barato.",analogy:"El sastre hace la prueba con alfileres antes de coser. Mover un alfiler lleva segundos; descoser una costura cuesta el traje."},
a1:{title:"Qué es un sprint",prompt:"En Scrum, un sprint es:",opts:["Un ciclo corto, de duración fija, que entrega un incremento utilizable","La fase final de pruebas antes del lanzamiento","Una reunión diaria de 15 minutos","El documento con todos los requisitos del proyecto"],hint:"Piensa en ritmo: ciclos repetidos con una entrega al final.",why:"Los sprints tienen duración fija (en general de 1 a 4 semanas) y terminan con algo que funciona y se puede evaluar.",analogy:"Es como este juego: cada 5 tickets paras, miras lo que entregaste y ajustas el rumbo, en lugar de evaluar todo recién al final."},
a2:{title:"Para qué sirve la daily",prompt:"¿Cuál es el propósito de la reunión diaria (daily)?",opts:["Sincronizar al equipo y sacar a la luz los impedimentos","Rendir cuentas individualmente a la jefatura","Detallar la solución técnica de cada tarea","Replanificar todo el backlog del producto"],hint:"Dura unos 15 minutos. ¿Qué cabe en ese tiempo?",why:"La daily alinea al equipo hacia la meta del sprint y revela los bloqueos temprano. Las discusiones largas siguen después, solo con los involucrados.",analogy:"Es la charla rápida del equipo en el entretiempo: quién marca a quién y dónde está el problema. La charla técnica completa queda para otro momento."},
a3:{title:"El MVP de las inscripciones",prompt:"¿Cuál sería un buen MVP para la escuela?",opts:["Inscripción en línea funcionando de punta a punta, sin libretas ni comedor","Todas las pantallas diseñadas, pero ninguna funcionando","El sistema completo, entregado en seis meses","Solo la base de datos, sin ninguna pantalla"],hint:"Un MVP es la versión más pequeña que ya resuelve el problema central para usuarios reales.",why:"El MVP entrega valor de punta a punta a pequeña escala y permite aprender del uso real antes de invertir en el resto.",analogy:"A quien quiere ir de A a B no le dan primero una rueda y después un chasis. Le dan una patineta, después una bicicleta, después un auto: cada etapa ya lo transporta."},
a4:{title:"No va a entrar en el sprint",prompt:"Faltan 2 días para el fin del sprint y el equipo nota que no llegará con todo. ¿Cuál es la mejor actitud?",opts:["Renegociar el alcance con el Product Owner, manteniendo la calidad","Saltarse las pruebas para entregar todo","Extender el sprint sin avisarle a nadie","Hacer horas extra en silencio hasta que entre"],hint:"En ágil, plazo y calidad son fijos. ¿Qué es flexible?",why:"El alcance es la variable de ajuste. Recortar calidad genera deuda técnica, y esconder el problema rompe la transparencia.",analogy:"Restaurante lleno: es mejor sacar un plato del menú de la noche que servir pollo crudo en todas las mesas."},
a5:{title:"Todo empezado, nada terminado",prompt:"El tablero del equipo tiene 12 tareas \"en curso\" para 3 personas y nada se termina. ¿Qué práctica de Kanban ataca ese problema?",opts:["Limitar el trabajo en curso (WIP)","Agregar más columnas al tablero","Hacer reuniones más largas","Alargar la duración del sprint"],hint:"El cuello de botella no es empezar; es terminar.",why:"Limitar el WIP obliga a terminar antes de empezar, reduce el cambio de contexto y deja a la vista los cuellos de botella.",analogy:"Una cocina de 4 hornallas con 12 ollas: nada se cocina bien. Mejor terminar cuatro platos y recién entonces poner los siguientes al fuego."},
g1:{title:"Qué es un commit",prompt:"Un commit en Git es:",opts:["Un registro del estado del proyecto en ese momento, con un mensaje","El envío de los archivos al servidor","Una copia de seguridad en otra carpeta","La eliminación de las versiones viejas"],hint:"Enviar al servidor es otro comando (push).",why:"El commit guarda una foto local de los cambios, con autor, fecha y mensaje. El envío al remoto ocurre después, con push.",analogy:"Es el punto de guardado de un videojuego: si el jefe final te derrota, puedes volver exactamente a ese momento."},
g2:{title:"Publicar una corrección",prompt:"Ordena los comandos para crear una rama, registrar el cambio y enviarlo al repositorio remoto.",hint:"Primero el espacio de trabajo, después preparar (add), registrar (commit) y enviar (push).",why:"La rama se crea antes de modificar; add elige qué entra; commit registra; push publica.",analogy:"Mandar una encomienda: conseguir la caja (rama), poner las cosas (add), cerrarla y etiquetarla (commit) y recién entonces llevarla al correo (push)."},
g3:{title:"Para qué sirve una rama",prompt:"¿Por qué Bia debería crear una rama para la nueva pantalla de descuentos?",opts:["Para trabajar aislada sin afectar la línea principal","Para que el repositorio sea más rápido","Porque Git prohíbe hacer commits en main","Para borrar el historial viejo"],hint:"Piensa en qué pasa si el código a medio hacer va directo a main.",why:"La rama aísla el trabajo en curso. Main se mantiene estable hasta que el cambio se revisa y se integra.",analogy:"Es el borrador de un documento: pruebas con libertad y pasas en limpio al original recién cuando el texto está bien."},
g4:{title:"Por qué el merge dio conflicto",prompt:"¿Cuándo ocurre un conflicto de merge?",opts:["Cuando dos ramas cambian las mismas líneas de maneras distintas","Siempre que dos personas trabajan en el mismo repositorio","Cuando la rama tiene más de diez commits","Cuando se crea un archivo nuevo en una de las ramas"],hint:"Git une por su cuenta los cambios en lugares distintos. ¿Qué es lo que no puede decidir?",why:"Si las dos versiones tocaron el mismo fragmento, Git no sabe cuál elegir y pide una decisión humana.",analogy:"Dos personas reescribieron la misma frase de un contrato. La notaría no elige por su cuenta: llama a las dos para acordar la redacción final."},
g5:{title:"Un buen mensaje de commit",prompt:"¿Qué mensaje de commit le sirve más a quien lea el historial dentro de un año?",opts:["Corrige el cálculo del descuento para compras de exactamente R$ 50","ajustes","versión final ahora sí","Cambios que hizo Caio el viernes"],hint:"El mensaje debe decir qué cambió y por qué, sin obligar a abrir el código.",why:"Un buen mensaje describe el cambio y su motivo. \"ajustes\" no ayuda a ubicar cuándo cambió un comportamiento.",analogy:"Es la etiqueta de las cajas de mudanza: \"cocina, vasos frágiles\" te ahorra abrir veinte cajas que dicen \"cosas\"."},
t1:{title:"Qué es una prueba unitaria",prompt:"Una prueba unitaria verifica:",opts:["Una unidad pequeña y aislada de código, como una función","El sistema entero desde la interfaz gráfica","Si el servidor aguanta muchos accesos","Si el cliente quedó conforme con la entrega"],hint:"El nombre lo dice: ¿cuál es la \"unidad\"?",why:"Las pruebas unitarias son pequeñas, rápidas y aisladas. El sistema entero es prueba de punta a punta; muchos accesos es prueba de carga.",analogy:"Es probar cada foquito antes de armar la guirnalda de luces. Si el conjunto falla después, ya sabes que el problema no está en los foquitos."},
t2:{title:"Elegir los valores de prueba",prompt:"La regla vale \"desde los 18\". ¿Qué conjunto de entradas prueba mejor la función?",hint:"¿Dónde suelen esconderse los errores de comparación (> en lugar de >=)?",why:"Los defectos se concentran en los límites. Probar justo por debajo, exactamente en el límite y justo por encima revela un >= cambiado por >.",analogy:"Para ver si una puerta cierra bien, revisas el marco, no el medio de la pared."},

function snapshot(sk){const o={};for(const k in sk)o[k]=sk[k].L;return o}
function guessLang(){const n=(navigator.language||"pt").slice(0,2).toLowerCase();return LANG[n]?n:"pt"}
function fresh(){
  const skills={}; SKILLS.forEach(s=>skills[s.id]={L:L0,n:0,c:0});

}

  if(vars&&typeof s==="string")for(const v in vars)s=s.split("{"+v+"}").join(vars[v]); return s;}
const skT=id=>Lg().skills[id]||LANG.pt.skills[id];
const itT=id=>Lg().items[id]||LANG.pt.items[id];

/* ---------- Motor adaptativo (BKT) ---------- */
const mastered=id=>S.skills[id].L>=MASTER;
const unlocked=id=>SK[id].pre.every(p=>S.skills[p].L>=UNLOCK);
const allMastered=()=>SKILLS.every(s=>mastered(s.id));
const avgL=()=>SKILLS.reduce((a,s)=>a+S.skills[s.id].L,0)/SKILLS.length;
function career(){const r=t("roles"); if(allMastered())return r[4]; const a=avgL(); return a>=.8?r[3]:a>=.55?r[2]:a>=.3?r[1]:r[0]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickItem(skillId,avoid){
  const L=S.skills[skillId].L, target=L<.4?1:L<.7?2:3;
  let pool=ITEMS.filter(i=>i.skill===skillId&&!avoid.includes(i.id));
  if(!pool.length)return null;
  const unseen=pool.filter(i=>!S.seen[i.id]), missed=pool.filter(i=>S.seen[i.id]&&!S.seen[i.id].ok);
  pool=unseen.length?unseen:missed.length?missed:pool;
  const best=Math.min(...pool.map(i=>Math.abs(i.d-target)));
  return shuffle(pool.filter(i=>Math.abs(i.d-target)===best))[0];
}
function pendingMissions(){return SKILLS.filter(s=>unlocked(s.id)&&!S.brief[s.id]&&!mastered(s.id))}
function fillBoard(lastId){
  let eligible=SKILLS.filter(s=>unlocked(s.id)&&!mastered(s.id)&&S.brief[s.id]).map(s=>s.id);
  if(!eligible.length&&allMastered())eligible=SKILLS.map(s=>s.id);
  S.board=S.board.filter(id=>IT[id]&&id!==lastId&&eligible.includes(IT[id].skill));
  const used=S.board.map(id=>IT[id].skill);
  const order=eligible.filter(k=>!used.includes(k)).sort((a,b)=>(S.skills[a].L+Math.random()*.3)-(S.skills[b].L+Math.random()*.3));
  for(const k of order){ if(S.board.length>=3)break; const it=pickItem(k,lastId?[lastId]:[]); if(it)S.board.push(it.id); }
  if(!S.board.length&&eligible.length){const it=pickItem(eligible[0],[]); if(it)S.board.push(it.id);}
}
function guessProb(it){return it.type==="mc"?1/itemOpts(it).length:it.type==="bug"?1/itemCode(it).split("\n").length:0.05}
function bkt(L,ok,g){const post=ok? L*(1-SLIP)/(L*(1-SLIP)+(1-L)*g) : L*SLIP/(L*SLIP+(1-L)*(1-g)); return Math.min(.995,post+(1-post)*T)}
function resolve(ok){
  const it=cur.item, sk=S.skills[it.skill], before=sk.L, roleBefore=career();
  const openBefore=SKILLS.filter(s=>unlocked(s.id)).map(s=>s.id);
  const g=cur.hint?Math.max(.5,guessProb(it)):guessProb(it);
  sk.L=bkt(before,ok,g); sk.n++; if(ok)sk.c++;
  S.streak=ok?S.streak+1:0; S.best=Math.max(S.best,S.streak);
  let xp=ok?it.d*10:2; if(ok&&cur.hint)xp=Math.ceil(xp/2); if(ok&&S.streak>=3)xp+=5; S.xp+=xp;
  S.seen[it.id]={n:(S.seen[it.id]?S.seen[it.id].n:0)+1,ok};
  S.log.push({item:it.id,skill:it.skill,bloom:it.bloom,d:it.d,ok,hint:cur.hint,ai:!!cur.aiUsed,lang:S.lang,pl:it.code?S.pl:null,before:+before.toFixed(3),after:+sk.L.toFixed(3),t:Date.now()});
  S.sprint.done.push({item:it.id,ok});
  const newly=SKILLS.filter(s=>unlocked(s.id)&&!openBefore.includes(s.id)).map(s=>skT(s.id).name);
  cur.done=true; cur.result={ok,before,after:sk.L,xp,newly,promo:career()!==roleBefore?career():null,masteredNow:before<MASTER&&sk.L>=MASTER};
  fillBoard(it.id); save();
}

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const k in attrs||{}){const v=attrs[k]; if(v==null||v===false)continue;
    if(k==="class")el.className=v; else if(k==="value")el.value=v; else if(k.startsWith("on"))el.addEventListener(k.slice(2),v); else el.setAttribute(k,v===true?"":v);}
  for(const kid of kids.flat(3)){ if(kid==null||kid===false)continue; el.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return el;
}
function sv(tag,attrs,...kids){
  const el=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const k in attrs||{}){ if(attrs[k]==null)continue; if(k.startsWith("on"))el.addEventListener(k.slice(2),attrs[k]); else el.setAttribute(k,attrs[k]); }
  for(const kid of kids.flat()){ if(kid==null)continue; el.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return el;
}
