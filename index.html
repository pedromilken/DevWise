<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevWise</title>
<meta name="description" content="Jogo instrutivo de programação e engenharia de software com knowledge tracing, histórias reais e tutor com IA.">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --sunken:#DCE3EA; --ink:#15233A; --muted:#56677F; --line:#C5D0DB;
  --prog:#0F7C7C; --prog-soft:#D5ECEA; --se:#5546B0; --se-soft:#E2DEF6;
  --gold:#B97F08; --gold-soft:#FBEBC4; --ok:#1B7F53; --ok-soft:#D8F0E3; --bad:#BC3550; --bad-soft:#F8DDE2;
  --code-bg:#15233A; --code-ink:#E6ECF5; --code-dim:#8296B3;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1828; --surface:#18243A; --sunken:#121D30; --ink:#E6ECF5; --muted:#9BABC2; --line:#2D3D58;
    --prog:#45BDB6; --prog-soft:#143A40; --se:#A296F5; --se-soft:#2A2757;
    --gold:#F0B73F; --gold-soft:#3D3116; --ok:#4CC98F; --ok-soft:#143B2C; --bad:#F2758E; --bad-soft:#44202B;
    --code-bg:#0A1120; --code-ink:#E6ECF5; --code-dim:#7488A6;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#18243A; --sunken:#121D30; --ink:#E6ECF5; --muted:#9BABC2; --line:#2D3D58;
  --prog:#45BDB6; --prog-soft:#143A40; --se:#A296F5; --se-soft:#2A2757;
  --gold:#F0B73F; --gold-soft:#3D3116; --ok:#4CC98F; --ok-soft:#143B2C; --bad:#F2758E; --bad-soft:#44202B;
  --code-bg:#0A1120; --code-ink:#E6ECF5; --code-dim:#7488A6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
p{margin:0 0 .8em}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:18px 0;border-bottom:2px solid var(--ink);margin-bottom:26px}
.brand{font-family:var(--display);font-weight:800;font-size:1.55rem;letter-spacing:-.02em;background:none;border:0;padding:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.95rem;color:var(--muted)}
.stats b{color:var(--ink)}
.nav{margin-left:auto;display:flex;gap:6px}
.nav button{background:none;border:2px solid transparent;border-radius:999px;padding:5px 15px;font-weight:700}
.nav button[aria-current="page"]{border-color:var(--ink)}

/* botões */
.btn{background:var(--ink);color:var(--bg);border:2px solid var(--ink);border-radius:10px;padding:11px 22px;font-weight:700}
.btn:disabled{opacity:.4}
.btn.ghost{background:none;color:var(--ink)}
.btn.small{padding:6px 14px;font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* início */
.home{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:20px}
.home h1{font-size:clamp(2.8rem,8vw,5.4rem);font-weight:800;letter-spacing:-.04em}
.home .lead{font-size:1.2rem;max-width:34em;margin:18px 0 26px}
.loop{list-style:none;margin:0;padding:0;counter-reset:s}
.loop li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.loop li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:1.9rem;color:var(--gold);line-height:1}
.loop strong{display:block}

/* quadro */
.sprintbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:18px}
.sprintbar h2{font-size:1.7rem;font-weight:800}
.pips{display:flex;gap:6px}
.pip{width:26px;height:9px;border-radius:3px;background:var(--sunken);border:1px solid var(--line)}
.pip.ok{background:var(--ok);border-color:var(--ok)}
.pip.bad{background:var(--bad);border-color:var(--bad)}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:start}
.col h3{font-size:1.05rem;font-weight:600;margin-bottom:12px;color:var(--muted)}
.tickets{display:grid;gap:14px}
.ticket{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--prog);border-radius:4px 12px 12px 4px;padding:15px 18px;box-shadow:0 2px 0 var(--line);transition:transform .12s}
.ticket.se{border-left-color:var(--se)}
.ticket:hover{transform:translate(-2px,-2px)}
.ticket .id{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.ticket .tt{font-family:var(--display);font-weight:600;font-size:1.22rem;display:block;margin:3px 0 9px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:.85rem}
.tag{padding:2px 9px;border-radius:999px;background:var(--prog-soft);color:var(--ink)}
.tag.se{background:var(--se-soft)}
.tag.plain{background:var(--sunken)}
.pts{letter-spacing:2px;color:var(--gold)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.mapwrap{overflow-x:auto}
.mapwrap svg{display:block;min-width:500px;width:100%;height:auto}
.node{cursor:pointer}
.node text{font-family:var(--body);fill:var(--ink)}
.node .pct{font-family:var(--display);font-weight:800;font-size:15px}
.node .lbl{font-size:14.5px}
.node.locked .lbl{fill:var(--muted)}
.skillinfo{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.95rem}
.skillinfo h4{font-family:var(--display);font-size:1.1rem;margin:0 0 4px}
.done{margin-top:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.85rem;padding:3px 10px;border-radius:6px;background:var(--ok-soft);border:1px solid var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad)}
.empty{color:var(--muted);font-size:.95rem}

/* ticket aberto */
.work{max-width:780px;margin:0 auto}
.work h2{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800;margin:6px 0 12px}
.prompt{font-size:1.1rem;margin:16px 0}
pre.code,.codelines,.pline{font-family:var(--mono);font-size:.93rem;line-height:1.6}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:16px 18px;overflow-x:auto;margin:0 0 18px;white-space:pre}
.opts{display:grid;gap:10px;margin-bottom:18px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 16px}
.opt.mono{font-family:var(--mono);font-size:.95rem}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.codelines{background:var(--code-bg);border-radius:10px;padding:10px;margin-bottom:18px;overflow-x:auto}
.cl{display:grid;grid-template-columns:30px 1fr;width:100%;min-width:max-content;text-align:left;background:none;border:2px solid transparent;border-radius:6px;color:var(--code-ink);padding:3px 8px;white-space:pre;font:inherit}
.cl .n{color:var(--code-dim)}
.cl:hover:not(:disabled){background:rgba(255,255,255,.07)}
.cl[aria-pressed="true"]{border-color:var(--gold)}
.cl.right{border-color:var(--ok);background:rgba(76,201,143,.18)}
.cl.wrong{border-color:var(--bad);background:rgba(242,117,142,.18)}
.parsons{display:grid;gap:14px;margin-bottom:18px}
.zone{border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:62px}
.zone.sol{border-style:solid;background:var(--code-bg)}
.zone h4{margin:0 0 8px;font:700 .85rem var(--body);color:var(--muted)}
.zone.sol h4{color:var(--code-dim)}
.prow{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto}
.pline{flex:1;text-align:left;white-space:pre;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.zone.sol .pline{background:rgba(255,255,255,.08);color:var(--code-ink);border-color:transparent}
.mv{background:none;border:1px solid var(--code-dim);color:var(--code-ink);border-radius:6px;width:34px;flex:none}
.hint{background:var(--gold-soft);border-left:5px solid var(--gold);border-radius:4px 10px 10px 4px;padding:11px 15px;margin-bottom:18px}
.fb{border-radius:12px;padding:20px;margin-top:22px;background:var(--ok-soft);border:2px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{font-size:1.45rem;font-weight:800;margin-bottom:10px}
.analogy{background:var(--surface);border-radius:10px;padding:13px 16px;margin:12px 0}
.analogy b{font-family:var(--display)}
.delta{font-weight:700}
.note{font-size:.9rem;color:var(--muted)}
.promo{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--gold)}

/* relatório */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:20px}
.kpis{display:flex;flex-wrap:wrap;gap:12px 34px;margin:6px 0 4px}
.kpis div{font-size:.92rem;color:var(--muted)}
.kpis b{display:block;font-family:var(--display);font-size:1.9rem;color:var(--ink);line-height:1.1}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted)}
.bar{height:10px;width:130px;background:var(--sunken);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--prog)}
.bar.se i{background:var(--se)}
.panel h3{font-size:1.2rem;font-weight:800;margin-bottom:10px}
textarea{width:100%;height:160px;font-family:var(--mono);font-size:.8rem;background:var(--sunken);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}

@media (max-width:820px){
  .home,.board{grid-template-columns:1fr}
  .nav{margin-left:0}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---- v2: missões, briefing, configurações, tutor IA ---- */
.nav{flex-wrap:wrap}
.mission{display:block;width:100%;text-align:left;background:var(--gold-soft);border:2px solid var(--gold);border-radius:12px;padding:15px 18px}
.mission .tt{font-family:var(--display);font-weight:800;font-size:1.25rem;display:block;margin:2px 0 4px}
.mission .who{font-size:.9rem;color:var(--muted)}
.col h3.gap{margin-top:24px}
.brief{max-width:800px;margin:0 auto}
.brief .client{color:var(--muted);margin-bottom:4px}
.brief h2{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.03em;margin-bottom:18px}
.story{font-size:1.15rem;line-height:1.65;border-left:6px solid var(--gold);padding:4px 0 4px 20px;margin:0 0 34px}
.brief h3{font-size:1.5rem;font-weight:800;margin:0 0 14px}
.theory{display:grid;gap:12px;margin-bottom:22px}
.theory div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.theory b{display:block;font-family:var(--display);font-size:1.08rem;margin-bottom:3px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tabs button{background:none;border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-size:.9rem;font-weight:700}
.tabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.sbc{background:var(--sunken);border-radius:10px;padding:14px 18px;font-size:.93rem;margin:22px 0}
.sbc b{font-family:var(--display)}
.sbc ul{margin:6px 0 0;padding-left:20px}
.ai{background:var(--se-soft);border-left:5px solid var(--se);border-radius:4px 10px 10px 4px;padding:11px 15px;margin-bottom:18px;white-space:pre-wrap}
.fb .ai{background:var(--surface);margin:12px 0}
.form{display:grid;gap:14px;max-width:560px}
.form label{display:grid;gap:4px;font-weight:700;font-size:.95rem}
.form input,.form select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
.langbar{display:flex;gap:4px}
.langbar button{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.82rem;font-weight:700}
.langbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* DevWise - dados independentes de idioma natural.
   Textos ficam em src/lang-*.js. Para acrescentar um idioma, copie um desses arquivos e traduza. */
const LANG = {};
const PLS = {py:"Python", js:"JavaScript", java:"Java", c:"C"};

/* Habilidades, pré-requisitos, posição no mapa e competências dos Referenciais de Formação da SBC (2017). */
const SKILLS = [
  {id:"var",   area:"prog", pre:[],       x:60,  y:62,  sbc:["CC-C.1.3","ES-C.1.1","ES-C.6.4"]},
  {id:"cond",  area:"prog", pre:["var"],  x:180, y:62,  sbc:["CC-C.1.3","ES-C.1.1","ES-C.6.4"]},
  {id:"loop",  area:"prog", pre:["cond"], x:300, y:62,  sbc:["CC-C.1.3","ES-C.1.1","ES-C.6.4"]},
  {id:"func",  area:"prog", pre:["loop"], x:420, y:62,  sbc:["CC-C.1.3","ES-C.1.1","ES-C.6.4"]},
  {id:"col",   area:"prog", pre:["func"], x:540, y:62,  sbc:["CC-C.1.3","ES-C.1.1"]},
  {id:"rec",   area:"prog", pre:["func"], x:556, y:158, sbc:["CC-C.1.3","ES-C.1.1"]},
  {id:"req",   area:"se",   pre:[],       x:60,  y:254, sbc:["ES-C.5.3"]},
  {id:"agil",  area:"se",   pre:["req"],  x:180, y:254, sbc:["ES-C.4.2","ES-C.4.4"]},
  {id:"git",   area:"se",   pre:[],       x:300, y:254, sbc:["ES-C.6.3"]},
  {id:"test",  area:"se",   pre:["func"], x:420, y:254, sbc:["ES-C.6.2","ES-C.7.3"]},
  {id:"design",area:"se",   pre:["func"], x:540, y:254, sbc:["ES-C.6.1","ES-C.6.7","ES-C.4.3"]}
];

/* Exemplo de código do arsenal teórico, por habilidade e linguagem. */
const EX = {
var:{py:`price = 4.50     # decimal
qty = 3          # inteiro / integer
item = "bread"   # texto / text
total = price * qty`,
js:`const price = 4.5;    // number
let qty = 3;
const item = "bread";  // string
let total = price * qty;`,
java:`double price = 4.50;
int qty = 3;
String item = "bread";
double total = price * qty;`,
c:`double price = 4.50;
int qty = 3;
char item[] = "bread";
double total = price * qty;`},
cond:{py:`if temp >= 39:
    level = "red"
elif temp >= 37.5:
    level = "yellow"
else:
    level = "green"`,
js:`if (temp >= 39) {
  level = "red";
} else if (temp >= 37.5) {
  level = "yellow";
} else {
  level = "green";
}`,
java:`if (temp >= 39) {
  level = "red";
} else if (temp >= 37.5) {
  level = "yellow";
} else {
  level = "green";
}`,
c:`if (temp >= 39) {
  level = 'R';
} else if (temp >= 37.5) {
  level = 'Y';
} else {
  level = 'G';
}`},
loop:{py:`total = 0
for grade in grades:
    total += grade
mean = total / len(grades)`,
js:`let total = 0;
for (const grade of grades) {
  total += grade;
}
const mean = total / grades.length;`,
java:`double total = 0;
for (double grade : grades) {
  total += grade;
}
double mean = total / grades.length;`,
c:`double total = 0;
for (int i = 0; i < n; i++) {
  total += grades[i];
}
double mean = total / n;`},
func:{py:`def freight(km):
    return 5 + 2 * km

print(freight(10))   # 25`,
js:`function freight(km) {
  return 5 + 2 * km;
}
console.log(freight(10)); // 25`,
java:`static int freight(int km) {
  return 5 + 2 * km;
}
System.out.println(freight(10)); // 25`,
c:`int freight(int km) {
  return 5 + 2 * km;
}
printf("%d", freight(10)); // 25`},
col:{py:`books = ["Dom Casmurro", "Vidas Secas"]
copies = {"Dom Casmurro": 2}
books.append("O Cortiço")
print(books[0], copies["Dom Casmurro"])`,
js:`const books = ["Dom Casmurro", "Vidas Secas"];
const copies = {"Dom Casmurro": 2};
books.push("O Cortiço");
console.log(books[0], copies["Dom Casmurro"]);`,
java:`List<String> books = new ArrayList<>(List.of("Dom Casmurro", "Vidas Secas"));
Map<String, Integer> copies = new HashMap<>();
copies.put("Dom Casmurro", 2);
System.out.println(books.get(0) + " " + copies.get("Dom Casmurro"));`,
c:`const char *books[3] = {"Dom Casmurro", "Vidas Secas"};
int copies[3] = {2, 1};
printf("%s %d", books[0], copies[0]);
/* C puro não tem dicionário: usam-se vetores paralelos ou structs */`},
rec:{py:`def total(n):
    if n == 0:            # caso base / base case
        return 0
    return n + total(n - 1)`,
js:`function total(n) {
  if (n === 0) return 0;   // caso base / base case
  return n + total(n - 1);
}`,
java:`static int total(int n) {
  if (n == 0) return 0;    // caso base / base case
  return n + total(n - 1);
}`,
c:`int total(int n) {
  if (n == 0) return 0;    /* caso base / base case */
  return n + total(n - 1);
}`}
};

/* Banco de itens. type: mc | parsons | bug. d: dificuldade 1-3. bloom: 1-5.
   Em "mc" a primeira opção é a correta (a tela embaralha). "@err" e "@none" são traduzidos.
   Itens sem "opts" aqui têm opções textuais no arquivo de idioma. */
const four = (py,js,java,c)=>({py,js,java,c});
const ITEMS = [
/* ---------------- Variáveis ---------------- */
{id:"v1",skill:"var",type:"mc",d:1,bloom:2,mono:true,opts:["5","8","13","@err"],code:four(
`x = 5
y = x
x = 8
print(y)`,
`let x = 5;
let y = x;
x = 8;
console.log(y);`,
`int x = 5;
int y = x;
x = 8;
System.out.println(y);`,
`int x = 5;
int y = x;
x = 8;
printf("%d", y);`)},
{id:"v2",skill:"var",type:"mc",d:2,bloom:2,mono:true,opts:["34","7","3 4","@err"],code:four(
`print("3" + "4")`,
`console.log("3" + "4");`,
`System.out.println("3" + "4");`,
`char s[8] = "3";
strcat(s, "4");
printf("%s", s);`)},
{id:"v3",skill:"var",type:"bug",d:2,bloom:4,answer:2,code:four(
`a = 1
b = 2
a = b
b = a
print(a, b)`,
`let a = 1;
let b = 2;
a = b;
b = a;
console.log(a, b);`,
`int a = 1;
int b = 2;
a = b;
b = a;
System.out.println(a + " " + b);`,
`int a = 1;
int b = 2;
a = b;
b = a;
printf("%d %d", a, b);`)},
{id:"v4",skill:"var",type:"mc",d:3,bloom:3,mono:true,opts:["3 1","3.5 0","4 1","3 0.5"],code:four(
`a = 7 // 2
b = 7 % 2
print(a, b)`,
`let a = Math.floor(7 / 2);
let b = 7 % 2;
console.log(a, b);`,
`int a = 7 / 2;
int b = 7 % 2;
System.out.println(a + " " + b);`,
`int a = 7 / 2;
int b = 7 % 2;
printf("%d %d", a, b);`)},
{id:"v5",skill:"var",type:"mc",d:1,bloom:2},
/* ---------------- Condicionais ---------------- */
{id:"c1",skill:"cond",type:"mc",d:1,bloom:2,mono:true,opts:["A","B","A B","@none"],code:four(
`n = 7
if n >= 7:
    print("A")
else:
    print("B")`,
`let n = 7;
if (n >= 7) {
  console.log("A");
} else {
  console.log("B");
}`,
`int n = 7;
if (n >= 7) {
  System.out.println("A");
} else {
  System.out.println("B");
}`,
`int n = 7;
if (n >= 7) {
  printf("A");
} else {

skills:{
var:{name:"Variáveis",about:"Guardar valores, tipos e operadores básicos.",client:"Padaria da Dona Lúcia",title:"O caixa que nunca fecha",
 story:"Toda noite, Dona Lúcia fecha o caixa da padaria no caderno, e a conta nunca bate. O sobrinho montou uma planilha, mas o preço do pão foi digitado como texto e a soma de dois pães virou \"4,504,50\". Ela pede algo simples: registrar preço, quantidade e troco sem erro. Antes de qualquer tela bonita, o sistema precisa guardar cada dado no tipo certo.",
 theory:[["Variável é um nome para um valor","Ela guarda um dado na memória para uso posterior. Atribuir copia o valor daquele instante; não cria um vínculo permanente entre duas variáveis."],
  ["Todo valor tem um tipo","Inteiro, decimal, texto e booleano se comportam de formas diferentes. Com textos, o + emenda; com números, soma. Dinheiro pede decimal; quantidade pede inteiro."],
  ["Divisão inteira e resto","A divisão inteira descarta a parte decimal, e o operador % devolve o que sobra. São a base para calcular troco, paridade e divisão em grupos."]]},
cond:{name:"Condicionais",about:"Decidir o caminho do programa com if, else if e else.",client:"Posto de saúde do bairro",title:"A fila que não pode ser por ordem de chegada",
 story:"No posto de saúde, a enfermeira Rosa faz a triagem de cabeça: febre alta passa na frente, idoso tem prioridade, o resto aguarda. Quando ela falta, a fila vira ordem de chegada e um caso grave espera duas horas. O posto quer que o sistema aplique as mesmas regras da Rosa, sempre, inclusive nos casos de fronteira, como a febre de exatamente 39 graus.",
 theory:[["Uma condição é uma pergunta de sim ou não","O programa avalia uma expressão booleana e segue por um único caminho. Operadores como >, >= e == definem exatamente onde fica a fronteira."],
  ["A ordem dos testes importa","Numa cadeia if / else if, o primeiro teste verdadeiro vence e os demais nem são avaliados. A regra mais restrita deve vir primeiro."],
  ["Combinar condições","E (and, &&) exige as duas verdadeiras; OU (or, ||) exige ao menos uma. O E é avaliado antes do OU; na dúvida, use parênteses."]]},
loop:{name:"Laços",about:"Repetir instruções com for e while.",client:"Escola Municipal Paulo Freire",title:"Quatrocentos boletins na mão",
 story:"A secretária Marta calcula a média de 400 alunos na calculadora, um por um, todo bimestre. Leva três dias e sempre escapa um erro. O cálculo é o mesmo para todos; só mudam as notas. É o retrato de uma tarefa que pede repetição automática: escrever a regra uma vez e deixar o computador percorrer a lista inteira.",
 theory:[["for: repetir para cada elemento","Use quando a quantidade de repetições é conhecida: cada aluno da lista, cada número de 0 a n-1. A contagem costuma começar em 0 e parar antes do limite."],
  ["while: repetir enquanto for verdade","Use quando não se sabe quantas voltas serão. Algo dentro do laço precisa caminhar em direção à saída, senão ele nunca termina."],
  ["Padrão acumulador","Uma variável começa com valor neutro (0, vazio, primeiro elemento) e é atualizada a cada volta: soma, contagem, maior valor."]]},
func:{name:"Funções",about:"Empacotar lógica, parâmetros, retorno e escopo.",client:"Cooperativa de entregas Roda Viva",title:"O frete calculado em três lugares",
 story:"A cooperativa de entregadores calcula o frete no site, no aplicativo e na planilha do financeiro. Quando o preço do quilômetro subiu, alguém atualizou só dois dos três lugares, e por uma semana os entregadores receberam menos do que deviam. A regra é uma só; ela precisa morar em um único lugar e ser chamada por todos.",
 theory:[["Função é uma regra com nome","Ela recebe parâmetros, executa passos e devolve um resultado com return. Definir uma vez e chamar em vários lugares elimina cópias divergentes."],
  ["Retornar não é imprimir","Imprimir mostra o valor na tela; retornar entrega o valor a quem chamou, que pode usá-lo em outros cálculos."],
  ["Escopo e passagem por valor","Variáveis criadas dentro da função são locais e somem ao final. Números passados como argumento chegam como cópia: alterá-los lá dentro não muda o original."]]},
col:{name:"Coleções",about:"Listas e dicionários, índices e referências.",client:"Biblioteca comunitária Casa das Letras",title:"O caderno de empréstimos sumiu",
 story:"A biblioteca comunitária anotava os empréstimos num caderno, que molhou na última chuva. Seu Antônio quer saber que livros existem, quantos exemplares há de cada um e quem está com qual. São muitos dados do mesmo tipo: guardá-los em variáveis soltas é impossível. É hora de organizar os dados em coleções.",
 theory:[["Lista: sequência ordenada","Guarda vários valores acessados por posição. O índice começa em 0, então uma lista com 3 itens vai do índice 0 ao 2."],
  ["Dicionário ou mapa: busca por chave","Associa uma chave a um valor, como título a exemplares. É a escolha certa quando se procura por nome, e não por posição."],
  ["Coleções são compartilhadas por referência","Atribuir uma lista a outra variável não copia os dados: os dois nomes apontam para a mesma coleção. Para duplicar, é preciso copiar de forma explícita."]]},
rec:{name:"Recursão",about:"Funções que chamam a si mesmas e o caso base.",client:"Cartório do 2º Ofício",title:"Pastas dentro de pastas dentro de pastas",
 story:"O cartório digitalizou 40 anos de documentos em pastas dentro de pastas, sem padrão de profundidade. A escrevente Helena precisa contar quantos arquivos existem no total. Um laço simples não resolve, porque cada pasta pode conter outras. A solução natural é: contar os arquivos desta pasta e repetir o mesmo procedimento em cada subpasta.",
 theory:[["Um problema definido em termos de si mesmo","A função resolve um pedaço pequeno e delega o restante a uma chamada dela mesma sobre um problema menor."],
  ["Caso base: o freio","É a situação simples respondida sem nova chamada (pasta vazia, n igual a 0). Toda chamada recursiva precisa se aproximar dele."],
  ["A pilha de chamadas","Cada chamada fica esperando a seguinte terminar. O que vem depois da chamada recursiva só executa na volta, da mais interna para a mais externa."]]},
req:{name:"Requisitos",about:"Descobrir e escrever o que o software precisa fazer.",client:"Posto de saúde do bairro",title:"\"Eu quero um aplicativo\"",
 story:"A diretora do posto chega à reunião decidida: \"quero um aplicativo igual ao do banco\". Depois de meia hora de conversa, o problema real aparece: pacientes faltam às consultas porque esquecem a data, e 30% das vagas se perdem. Talvez a solução seja um simples lembrete por mensagem. Quem constrói o que foi pedido, sem entender o que é preciso, entrega o software errado no prazo certo.",
 theory:[["Necessidade vem antes da solução","Clientes descrevem soluções; o engenheiro investiga o problema por trás com entrevistas, observação e protótipos (elicitação)."],
  ["Funcional e não funcional","Funcional é o que o sistema faz (agendar, lembrar). Não funcional é quão bem ele faz (tempo de resposta, segurança, disponibilidade)."],
  ["Requisito bom é verificável","\"Rápido\" e \"amigável\" não podem ser testados. \"Responde em até 2 s para 95% das consultas\" pode. Histórias de usuário seguem: Como [papel], quero [ação], para [benefício]."]]},
agil:{name:"Ágil",about:"Sprints, MVP e entrega incremental.",client:"Escola Municipal Paulo Freire",title:"A matrícula começa em seis semanas",
 story:"A escola quer um sistema completo de matrícula, com boletim, merenda e transporte. O período de matrículas começa em seis semanas, e a lista de desejos levaria seis meses. Se o time sumir e voltar só com tudo pronto, chegará tarde. A saída é entregar primeiro o essencial funcionando, a matrícula, e crescer a partir do uso real.",
 theory:[["Entregar em ciclos curtos","Um sprint tem duração fixa e termina com um incremento utilizável. O retorno de quem usa orienta o ciclo seguinte."],
  ["MVP: aprender cedo","O produto mínimo viável resolve o problema central de ponta a ponta, em escala pequena, para validar hipóteses antes de investir mais."],
  ["Escopo é a variável de ajuste","Prazo e qualidade ficam fixos; negocia-se o que entra. Limitar o trabalho em andamento ajuda o time a terminar antes de começar algo novo."]]},
git:{name:"Git",about:"Versionar código: commits, branches e merges.",client:"Time da Ponte",title:"A sexta-feira em que o código sumiu",
 story:"Na sexta à tarde, Caio e Bia editaram o mesmo arquivo do sistema da padaria. Cada um salvou sua versão na pasta compartilhada como \"final_agora_vai.zip\". A última gravação apagou o trabalho do outro, e ninguém sabia dizer qual versão estava no ar. A Ponte decidiu: a partir de segunda-feira, todo código vive em um repositório Git.",
 theory:[["Commit: um retrato com legenda","Registra o estado do projeto com autor, data e mensagem. Mensagens claras contam o que mudou e por quê."],
  ["Branch: trabalhar em paralelo","Cada funcionalidade nasce em uma ramificação isolada, e a linha principal continua estável até a revisão e a integração (merge)."],
  ["Conflito é pedido de decisão","Se duas branches alteram as mesmas linhas, o Git não escolhe sozinho: mostra as duas versões e pede que alguém decida."]]},
test:{name:"Testes",about:"Verificar o código com testes automatizados.",client:"Padaria da Dona Lúcia",title:"O desconto que cobrou a mais",
 story:"A padaria lançou 10% de desconto acima de 50 reais. Um cliente comprou exatamente 50 e não ganhou o desconto; outro recebeu o desconto duas vezes. Dona Lúcia devolveu dinheiro a semana inteira. O erro estava numa comparação de fronteira que ninguém testou. Um teste automatizado de três linhas teria avisado antes do cliente.",
 theory:[["Teste unitário","Verifica uma pequena unidade isolada, como uma função, de forma rápida e repetível. O padrão é preparar, agir e verificar (Arrange, Act, Assert)."],
  ["Valores de fronteira","Defeitos se concentram nos limites das regras. Teste logo abaixo, exatamente no limite e logo acima."],
  ["Teste de regressão e limites dos testes","Todo bug corrigido ganha um teste que o reproduz, para nunca voltar. Testes revelam a presença de defeitos, mas não provam a ausência."]]},
design:{name:"Design",about:"Coesão, acoplamento, SOLID e refatoração.",client:"Cooperativa de entregas Roda Viva",title:"Mais uma forma de pagamento, mais um remendo",
 story:"A cooperativa aceitava dinheiro; depois veio o cartão, depois o Pix, agora o vale-refeição. A cada novidade, alguém acrescenta mais um \"se\" numa função de 300 linhas que todos têm medo de tocar. Na última mudança, o Pix parou de funcionar por dois dias. O software funciona, mas ficou caro de mudar. É um problema de design.",
 theory:[["Alta coesão, baixo acoplamento","Cada módulo cuida de um assunto e depende pouco dos outros. Assim ele pode ser entendido, testado e trocado isoladamente."],
  ["Princípios SOLID","Responsabilidade única: um motivo para mudar. Aberto/fechado: estender sem editar o que já funciona. Inversão de dependência: depender de interfaces, não de implementações concretas."],
  ["Refatorar","Melhorar a estrutura sem mudar o comportamento, em passos pequenos e protegidos por testes: extrair função, eliminar duplicação, dar nomes claros."]]}
},
items:{
v1:{title:"A etiqueta que mudou de lugar",prompt:"Dona Lúcia copiou o preço antigo antes de reajustar. O que o programa imprime?",hint:"Siga linha a linha: quanto valia x no momento em que y o recebeu?",why:"y recebe uma cópia do valor que x tinha naquele instante (5). Mudar x depois não altera y.",analogy:"Variável é uma etiqueta num valor. y ganhou sua própria etiqueta no 5; mover a etiqueta x para o 8 não mexe na de y."},
v2:{title:"A soma que não soma",prompt:"Foi o erro da planilha do sobrinho. O que o programa imprime?",hint:"Repare nas aspas: esses valores são números ou textos?",why:"Entre aspas, 3 e 4 são textos. Com textos, a operação emenda em vez de somar.",analogy:"Textos são colares de contas: juntar dois colares dá um colar maior, não uma soma. Para somar, converta antes em número."},
v3:{title:"Troca de valores que perde um deles",prompt:"O código deveria trocar os valores de a e b, mas imprime 2 2. Em qual linha o valor original de a é perdido?",hint:"Depois de qual linha o número 1 deixa de existir em qualquer variável?",why:"Ao fazer a receber b, o 1 é sobrescrito sem ter sido guardado. A troca correta usa uma variável temporária.",analogy:"Para trocar o conteúdo de dois copos, você precisa de um terceiro copo. Despejar um direto no outro perde um dos líquidos."},
v4:{title:"Dividindo o troco",prompt:"Sete moedas divididas entre dois caixas. O que o programa imprime?",hint:"A divisão inteira descarta a parte decimal; % devolve o que sobra.",why:"A divisão inteira de 7 por 2 dá 3, e o resto é 1.",analogy:"Dividir 7 balas entre 2 crianças: cada uma leva 3 e sobra 1 na mesa."},
v5:{title:"O tipo certo para o preço",prompt:"Qual tipo de dado é o mais adequado para guardar o preço R$ 4,50 de um pão?",opts:["Número decimal (ponto flutuante)","Número inteiro","Texto","Booleano"],hint:"O valor tem centavos e será usado em contas.",why:"Preço tem casas decimais e entra em cálculos, então pede um tipo numérico decimal. Como texto, não daria para somar; como inteiro, perderia os centavos.",analogy:"É escolher o recipiente certo: água vai em garrafa, não em peneira. Cada tipo de dado foi feito para um tipo de conteúdo."},
c1:{title:"A febre de exatamente 39",prompt:"Regra de fronteira da triagem. O que o programa imprime?",hint:">= significa maior OU igual.",why:"7 >= 7 é verdadeiro, então só o primeiro bloco executa e o else é ignorado.",analogy:"if/else é uma bifurcação na estrada: o carro segue por um único lado, nunca pelos dois."},
c2:{title:"A ordem das regras da Rosa",prompt:"As regras foram escritas nesta ordem. O que o programa imprime?",hint:"Depois que um teste da cadeia é verdadeiro, os seguintes nem são avaliados.",why:"30 > 20 já é verdadeiro, então só A é impresso. A condição mais restrita (t > 28) deveria vir primeiro.",analogy:"É uma fila de catracas: quem passou pela primeira não tenta as outras. A catraca mais exigente precisa ficar na frente."},
c3:{title:"Senha par ou ímpar",prompt:"O posto chama senhas pares no guichê 1 e ímpares no 2. Monte o programa que classifica o número.",hint:"Primeiro o dado existe; depois vem o teste do resto da divisão por 2.",why:"O dado precisa existir antes do teste. Resto zero na divisão por 2 indica par; o else cobre todo o restante.",analogy:"Como na triagem: primeiro o paciente chega, depois vem a pergunta, e cada resposta leva a uma sala."},
c4:{title:"Quem vem primeiro: E ou OU",prompt:"O resultado da expressão é verdadeiro ou falso?",opts:["Verdadeiro","Falso","Dá erro","Depende da linguagem"],hint:"Assim como a multiplicação vem antes da soma, um dos operadores lógicos é avaliado antes.",why:"O E tem precedência sobre o OU. Primeiro falso E falso dá falso; depois verdadeiro OU falso dá verdadeiro. Vale nas quatro linguagens do jogo.",analogy:"Igual a 2 + 3 × 0: você resolve a multiplicação antes. O E é a multiplicação da lógica; na dúvida, use parênteses."},
c5:{title:"Sessenta anos sem desconto",prompt:"Pessoas com exatamente 60 anos deveriam pagar meia, mas pagam inteira. Qual linha corrigir?",hint:"Teste mentalmente com 60: a condição é verdadeira?",why:"60 > 60 é falso. A regra \"a partir de 60\" pede >=. Erros de fronteira são dos mais comuns em condicionais.",analogy:"É a placa \"altura mínima 1,40 m\" com um fiscal que barra quem mede exatamente 1,40. A regra está certa; a comparação, errada."},
l1:{title:"De onde a contagem começa",prompt:"Quais valores o laço imprime?",hint:"A contagem começa em 0 e para antes de 3.",why:"São gerados 0, 1 e 2: três valores, começando do zero e sem incluir o 3.",analogy:"Como os andares de um prédio que começa no térreo (0): três pavimentos vão do 0 ao 2."},
l2:{title:"Somando as notas",prompt:"O que o programa imprime?",hint:"O laço inclui o 1 e exclui o 5.",why:"O laço percorre 1, 2, 3 e 4, e a soma é 10. O limite final fica de fora.",analogy:"total é um cofrinho: a cada volta cai uma moeda com o valor de i. No fim, você conta o que há dentro."},
l3:{title:"Contagem regressiva sem fim",prompt:"O código deveria imprimir 3, 2, 1 e depois \"end\", mas nunca termina. Qual linha corrigir?",hint:"Para o laço parar, n > 0 precisa se tornar falso em algum momento.",why:"Somar 1 afasta n de zero, então a condição é sempre verdadeira. O correto é subtrair 1.",analogy:"É descer uma escada subindo um degrau a cada passo: você nunca chega ao chão. Todo while precisa caminhar em direção à saída."},
l4:{title:"A maior nota da turma",prompt:"Marta quer a maior nota da lista. Monte o programa.",hint:"Comece supondo que a primeira é a maior; depois compare com cada uma.",why:"O padrão é: palpite inicial (primeiro elemento), percorrer tudo, trocar o campeão quando aparecer alguém maior e só imprimir depois do laço.",analogy:"É o \"rei do morro\": o primeiro sobe ao topo e cada desafiante só toma o lugar se for maior. Quem estiver lá no fim é o máximo."},
l5:{title:"Quantas vezes dá para dividir ao meio",prompt:"O que o programa imprime?",hint:"Acompanhe n a cada volta: 16, 8, ...",why:"n passa por 8, 4, 2 e 1: quatro divisões até a condição n > 1 ficar falsa.",analogy:"Dobrar uma folha ao meio repetidamente: o while não sabe de antemão quantas dobras serão, só para quando não dá mais."},
f1:{title:"Usando o valor devolvido",prompt:"O que o programa imprime?",hint:"O return entrega o resultado para quem chamou a função.",why:"A função devolve 8, guardado em r. Depois, 8 + 1 = 9.",analogy:"Função é uma máquina de suco: entra a fruta (argumento) e sai o copo (retorno), que você usa como quiser."},
f2:{title:"Imprimir não é retornar",prompt:"Uma função calcula o frete e apenas imprime o valor, sem retorná-lo. Qual é a consequência?",opts:["Quem chamou não consegue usar o valor em outros cálculos","Nenhuma: imprimir e retornar são equivalentes","A função fica mais rápida","O valor passa a ser global automaticamente"],hint:"Para onde vai o valor impresso? E o retornado?",why:"Imprimir envia o valor para a tela e só. Retornar entrega o valor ao código que chamou, que pode somá-lo, guardá-lo ou repassá-lo.",analogy:"Imprimir é mostrar o prato na vitrine; retornar é entregá-lo ao cliente. Quem só viu a vitrine sai de mãos vazias."},
f3:{title:"O x de dentro e o x de fora",prompt:"O que o programa imprime?",hint:"A variável criada dentro da função é a mesma de fora?",why:"O x = 99 é uma variável local, que existe só durante a chamada. O x externo continua valendo 10.",analogy:"A função é uma sala com seu próprio quadro branco. O que se escreve lá dentro é apagado na saída e não altera o quadro do corredor."},
f4:{title:"Uma função para a média",prompt:"Monte a função que calcula a média de uma lista e a chamada que imprime o resultado.",hint:"Dentro da função: zere o total, acumule no laço e só então devolva a divisão.",why:"O return vem depois do laço, senão a função sairia na primeira volta. A chamada vem depois da definição.",analogy:"Receita de bolo: primeiro o nome da receita, depois os passos na ordem, e só no fim você serve. Não dá para servir no meio da mistura."},
f5:{title:"O argumento é uma cópia",prompt:"O que o programa imprime?",hint:"A função recebe a variável x ou uma cópia do valor dela?",why:"Números são passados por valor: n é uma cópia de x. Alterar n dentro da função não muda x, que segue valendo 5.",analogy:"Você entrega uma fotocópia do documento. Podem rabiscar a cópia à vontade: o original na sua gaveta continua intacto."},
k1:{title:"Índices começam em zero",prompt:"O que o programa imprime?",hint:"O primeiro elemento está no índice 0.",why:"Os índices são 0 (10), 1 (20) e 2 (30).",analogy:"O índice é a distância até o início da fila: o primeiro está a 0 passos, o segundo a 1 passo."},
k2:{title:"Duas variáveis, uma só lista",prompt:"O que o programa imprime?",hint:"A segunda variável é uma nova coleção ou outro nome para a mesma?",why:"A atribuição não copia a coleção: os dois nomes apontam para os mesmos dados. Alterar por b aparece em a.",analogy:"a e b são duas chaves da mesma gaveta. Quem guarda algo usando a chave b muda o que a chave a vai encontrar."},
k3:{title:"Lista ou dicionário",prompt:"Seu Antônio quer consultar quantos exemplares há de um livro digitando o título. Qual estrutura é a mais adequada?",opts:["Dicionário (mapa) de título para quantidade","Lista de quantidades na ordem de chegada","Uma variável para cada livro","Um único texto com tudo separado por vírgulas"],hint:"A busca será por posição ou por nome?",why:"O dicionário associa chave a valor e busca direto pela chave. Numa lista, seria preciso saber a posição ou percorrer tudo.",analogy:"Dicionário é uma agenda de contatos: você procura pelo nome e encontra o telefone, sem ler a agenda inteira."},
k4:{title:"Um passo além do fim",prompt:"O laço tenta acessar uma posição que não existe. Qual linha causa o problema?",hint:"Com 3 elementos, qual é o maior índice válido?",why:"O laço gera os índices 0, 1, 2 e 3, mas o 3 não existe. O limite correto é o tamanho da coleção, sem incluí-lo.",analogy:"É o erro do poste a mais: numa cerca com 3 tábuas, quem conta até 4 tenta pregar uma tábua que não existe."},
k5:{title:"Quantos livros acima de quatro exemplares",prompt:"O que o programa imprime?",hint:"c conta elementos; não soma os valores.",why:"Apenas 5 e 8 são maiores que 4, então o contador termina em 2.",analogy:"É o porteiro com contador de mão: ele clica uma vez por pessoa que atende ao critério, sem se importar com a altura de cada uma."},
r1:{title:"O freio da recursão",prompt:"O que toda função recursiva precisa ter para não se chamar para sempre?",opts:["Um caso base, que responde sem nova chamada","Um laço while interno","Uma variável global de controle","Pelo menos dois parâmetros"],hint:"Pense no que faz as chamadas pararem.",why:"O caso base é a situação simples resolvida diretamente. Cada chamada recursiva precisa se aproximar dele.",analogy:"Bonecas russas: você abre uma, acha outra menor, e para ao chegar à boneca maciça. Sem ela, abriria bonecas para sempre."},
r2:{title:"Fatorial passo a passo",prompt:"O que o programa imprime?",hint:"Expanda: fact(4) = 4 × fact(3) = ...",why:"4 × 3 × 2 × 1 = 24. Cada chamada espera a resposta da chamada menor e então multiplica.",analogy:"Fila de pessoas perguntando \"qual é o seu número?\" à da frente. A primeira responde 1, e a resposta volta pela fila sendo multiplicada."},
r3:{title:"Recursão que não anda",prompt:"A função deveria imprimir n, n-1, ..., 1, mas estoura a pilha de chamadas. Qual linha está errada?",hint:"A chamada recursiva está se aproximando do caso base?",why:"Chamar count(n) repete o mesmo problema para sempre. O correto é count(n - 1), que caminha até zero.",analogy:"É pedir a alguém que desça a escada, mas a cada passo ele pisa no mesmo degrau. O caso base existe, só nunca é alcançado."},
r4:{title:"Imprimindo na volta",prompt:"O que o programa imprime?",hint:"A impressão vem depois da chamada recursiva. Quando ela finalmente executa?",why:"Cada chamada primeiro desce até o caso base; as impressões só acontecem no retorno, da mais interna (1) para a mais externa (3).",analogy:"Pilha de pratos: você empilha 3, 2, 1 e só lava ao desempilhar. O último a entrar é o primeiro a ser lavado."},
r5:{title:"Duas chamadas por vez",prompt:"O que o programa imprime?",hint:"Calcule de baixo para cima: f(0), f(1), f(2)...",why:"É a sequência de Fibonacci: 0, 1, 1, 2, 3, 5. Logo, f(5) = 5.",analogy:"Árvore genealógica ao contrário: cada resposta depende das duas anteriores, até chegar aos ancestrais conhecidos (os casos base)."},
q1:{title:"Funcional ou não funcional",prompt:"Qual destes é um requisito NÃO funcional do sistema do posto?",opts:["O sistema deve responder em até 2 segundos","O paciente pode remarcar a consulta","O sistema envia lembrete por mensagem","A recepcionista cadastra pacientes"],hint:"Não funcional descreve qualidade (quão bem), não comportamento (o que faz).",why:"Tempo de resposta é um atributo de qualidade. Os outros três descrevem funções que o sistema executa.",analogy:"Num carro, funcional é andar, frear e acender o farol. Não funcional é o consumo, o conforto e a segurança com que ele faz isso."},
q2:{title:"Requisito que dá para testar",prompt:"Qual requisito está escrito de forma verificável?",opts:["A busca retorna resultados em menos de 1 s para 95% das consultas","O sistema deve ser rápido","A interface deve ser amigável","O sistema deve ser moderno e robusto"],hint:"Pergunte: como eu provaria que isso foi atendido?",why:"Só a primeira opção tem critério mensurável. \"Rápido\", \"amigável\" e \"moderno\" viram discussão na hora da entrega.",analogy:"É a diferença entre pedir ao pedreiro \"uma parede alta\" e \"uma parede de 2,80 m\". Só a segunda dá para conferir com a trena."},
q3:{title:"História de usuário bem formada",prompt:"Qual opção segue o formato de história de usuário?",opts:["Como paciente, quero receber um lembrete na véspera, para não perder a consulta","Criar a tabela consultas com chave estrangeira para paciente","O sistema deve usar React no front-end","Tela de agendamento, versão 2"],hint:"O formato é: Como [papel], quero [ação], para [benefício].",why:"A história descreve quem precisa, o que precisa e por quê, sem ditar a solução técnica.",analogy:"É um pedido no restaurante: o cliente diz o prato e a fome que quer matar, não a marca da panela que o chef deve usar."},
q4:{title:"\"Igual ao do banco\"",prompt:"A diretora pede \"um aplicativo igual ao do banco\". Qual é o melhor primeiro passo?",opts:["Perguntar que problema do dia a dia ela quer resolver","Começar o aplicativo imediatamente","Recusar, pois aplicativos são caros","Estimar o prazo e só depois conversar"],hint:"Ela descreveu uma solução. Qual é a necessidade por trás dela?",why:"Pedidos costumam vir como soluções. Entender a necessidade real (as faltas às consultas) pode revelar algo mais simples e mais útil.",analogy:"O paciente chega pedindo antibiótico; o bom médico pergunta primeiro o que ele está sentindo."},
q5:{title:"Validar antes de construir",prompt:"Qual técnica valida os requisitos com a recepção do posto antes de programar?",opts:["Mostrar um protótipo de papel das telas e observar o uso","Entregar o sistema pronto e colher reclamações","Enviar o documento de requisitos por e-mail e aguardar","Perguntar apenas à diretora se está tudo certo"],hint:"Procure a opção mais barata que coloca o usuário real diante da ideia.",why:"Protótipos de baixa fidelidade custam minutos e revelam mal-entendidos cedo, quando corrigir ainda é barato.",analogy:"O alfaiate faz a prova com alfinetes antes de costurar. Ajustar alfinete custa segundos; desmanchar costura custa o terno."},
a1:{title:"O que é um sprint",prompt:"No Scrum, um sprint é:",opts:["Um ciclo curto, de duração fixa, que entrega um incremento utilizável","A fase final de testes antes do lançamento","Uma reunião diária de 15 minutos","O documento com todos os requisitos do projeto"],hint:"Pense em ritmo: ciclos repetidos com entrega ao final.",why:"Sprints têm duração fixa (em geral de 1 a 4 semanas) e terminam com algo que funciona e pode ser avaliado.",analogy:"É como este jogo: a cada 5 tickets você para, olha o que entregou e ajusta o rumo, em vez de avaliar tudo só no fim."},
a2:{title:"Para que serve a daily",prompt:"Qual é o propósito da reunião diária (daily)?",opts:["Sincronizar o time e expor impedimentos","Prestar contas individualmente à chefia","Detalhar a solução técnica de cada tarefa","Replanejar todo o backlog do produto"],hint:"Ela dura uns 15 minutos. O que cabe nesse tempo?",why:"A daily alinha o time em direção à meta do sprint e revela bloqueios cedo. Discussões longas seguem depois, só com os envolvidos.",analogy:"É a conversa rápida do time no intervalo do jogo: quem marca quem e onde está o problema. A preleção completa fica para outra hora."},
a3:{title:"O MVP da matrícula",prompt:"Qual seria um bom MVP para a escola?",opts:["Matrícula on-line funcionando de ponta a ponta, sem boletim nem merenda","Todas as telas desenhadas, mas nenhuma funcionando","O sistema completo, entregue em seis meses","Só o banco de dados, sem tela alguma"],hint:"MVP é a menor versão que já resolve o problema central para usuários reais.",why:"O MVP entrega valor de ponta a ponta em escala pequena e permite aprender com o uso real antes de investir no restante.",analogy:"Quem quer ir de A a B não recebe primeiro uma roda e depois um chassi. Recebe um skate, depois uma bicicleta, depois um carro: cada etapa já transporta."},
a4:{title:"Não vai caber no sprint",prompt:"Faltam 2 dias para o fim do sprint e o time percebe que não entregará tudo. Qual é a melhor atitude?",opts:["Renegociar o escopo com o Product Owner, mantendo a qualidade","Pular os testes para entregar tudo","Estender o sprint sem avisar ninguém","Fazer horas extras em silêncio até caber"],hint:"No ágil, prazo e qualidade são fixos. O que é flexível?",why:"O escopo é a variável de ajuste. Cortar qualidade gera dívida técnica, e esconder o problema quebra a transparência.",analogy:"Restaurante lotado: é melhor tirar um prato do cardápio da noite do que servir frango cru para todas as mesas."},
a5:{title:"Tudo começado, nada terminado",prompt:"O quadro do time tem 12 tarefas \"em andamento\" para 3 pessoas e nada é concluído. Qual prática do Kanban ataca esse problema?",opts:["Limitar o trabalho em andamento (WIP)","Adicionar mais colunas ao quadro","Fazer reuniões mais longas","Aumentar a duração do sprint"],hint:"O gargalo não é começar; é terminar.",why:"Limitar o WIP obriga a terminar antes de começar, reduz a troca de contexto e torna os gargalos visíveis.",analogy:"Fogão de 4 bocas com 12 panelas: nada cozinha direito. Melhor terminar quatro pratos e só então pôr os próximos no fogo."},
g1:{title:"O que é um commit",prompt:"Um commit no Git é:",opts:["Um registro do estado do projeto naquele momento, com mensagem","O envio dos arquivos para o servidor","Uma cópia de segurança em outra pasta","A exclusão das versões antigas"],hint:"Enviar ao servidor é outro comando (push).",why:"O commit grava um retrato local das mudanças, com autor, data e mensagem. O envio ao remoto acontece depois, com push.",analogy:"É o ponto de salvamento de um jogo: se o chefão derrotar você, dá para voltar exatamente àquele momento."},
g2:{title:"Publicando uma correção",prompt:"Ordene os comandos para criar uma branch, registrar a mudança e enviá-la ao repositório remoto.",hint:"Primeiro o espaço de trabalho, depois preparar (add), registrar (commit) e enviar (push).",why:"Cria-se a branch antes de alterar; add escolhe o que entra; commit registra; push publica.",analogy:"Mandar uma encomenda: separar a caixa (branch), pôr os itens (add), lacrar e etiquetar (commit) e só então levar ao correio (push)."},
g3:{title:"Para que serve uma branch",prompt:"Por que Bia deveria criar uma branch para a nova tela de descontos?",opts:["Para trabalhar isoladamente sem afetar a linha principal","Para deixar o repositório mais rápido","Porque o Git proíbe commits na main","Para apagar o histórico antigo"],hint:"Pense no que acontece se o código incompleto for direto para a main.",why:"A branch isola o trabalho em andamento. A main continua estável até a mudança ser revisada e integrada.",analogy:"É o rascunho de um documento: você experimenta à vontade e só passa a limpo no original quando o texto está bom."},
g4:{title:"Por que o merge deu conflito",prompt:"Quando ocorre um conflito de merge?",opts:["Quando duas branches alteram as mesmas linhas de formas diferentes","Sempre que duas pessoas trabalham no mesmo repositório","Quando a branch tem mais de dez commits","Quando um arquivo novo é criado em uma das branches"],hint:"O Git junta sozinho mudanças em trechos diferentes. O que ele não consegue decidir?",why:"Se as duas versões mexeram no mesmo trecho, o Git não sabe qual escolher e pede uma decisão humana.",analogy:"Duas pessoas reescreveram a mesma frase de um contrato. O cartório não escolhe por conta própria: chama as duas para decidir a redação final."},
g5:{title:"Uma boa mensagem de commit",prompt:"Qual mensagem de commit é a mais útil para quem ler o histórico daqui a um ano?",opts:["Corrige cálculo do desconto para compras de exatamente R$ 50","ajustes","versão final agora vai","Alterações feitas pelo Caio na sexta"],hint:"A mensagem deve dizer o que mudou e por quê, sem obrigar a abrir o código.",why:"Uma boa mensagem descreve a mudança e seu motivo. \"ajustes\" não ajuda a localizar quando um comportamento mudou.",analogy:"É a etiqueta das caixas na mudança: \"cozinha, copos frágeis\" poupa abrir vinte caixas marcadas como \"coisas\"."},
t1:{title:"O que é teste unitário",prompt:"Um teste unitário verifica:",opts:["Uma pequena unidade de código isolada, como uma função","O sistema inteiro pela interface gráfica","Se o servidor aguenta muitos acessos","Se o cliente ficou satisfeito com a entrega"],hint:"O nome entrega: qual é a \"unidade\"?",why:"Testes unitários são pequenos, rápidos e isolados. Sistema inteiro é teste de ponta a ponta; muitos acessos é teste de carga.",analogy:"É testar cada lâmpada antes de montar o pisca-pisca. Se o conjunto falhar depois, você já sabe que o problema não está nas lâmpadas."},
t2:{title:"Escolhendo valores de teste",prompt:"A regra vale \"a partir de 18\". Qual conjunto de entradas testa melhor a função?",hint:"Onde os erros de comparação (> no lugar de >=) costumam se esconder?",why:"Defeitos se concentram nas fronteiras. Testar logo abaixo, exatamente no limite e logo acima revela uma troca de >= por >.",analogy:"Para conferir se a porta fecha bem, você examina o batente, não o meio da parede."},
t3:{title:"Preparar, agir, verificar",prompt:"Monte o teste do desconto da padaria no padrão preparar, agir e verificar.",hint:"Primeiro os dados, depois a chamada da função testada e, por fim, a conferência.",why:"O teste prepara o cenário, executa a ação e compara o resultado com o esperado.",analogy:"Como provar uma receita: separar os ingredientes, cozinhar e só então experimentar para ver se ficou como deveria."},
t4:{title:"Tudo verde, zero bugs?",prompt:"Os 200 testes passaram e a cobertura é de 100%. Pode-se afirmar que o software não tem defeitos?",opts:["Não: testes revelam a presença de defeitos, não provam a ausência","Sim: cobertura de 100% garante isso","Sim, desde que os testes sejam unitários","Não, porque 200 testes é pouco; com 1000 seria possível"],hint:"Cobertura mede linhas executadas, não situações verificadas.",why:"Cobertura diz que as linhas rodaram, não que todas as combinações de entrada e requisitos foram checadas. É a observação clássica de Dijkstra.",analogy:"O alarme de fumaça em silêncio indica que não há fumaça agora, não que a fiação da casa inteira esteja em ordem."},
t5:{title:"O bug do desconto não pode voltar",prompt:"Você encontrou a causa do bug dos R$ 50. Qual é a melhor sequência?",opts:["Escrever um teste que reproduz o bug, corrigir e manter o teste","Corrigir direto em produção e avisar a Dona Lúcia","Corrigir e testar manualmente uma vez","Anotar o bug num documento para lembrar depois"],hint:"Como garantir que daqui a seis meses ninguém reintroduza o mesmo erro?",why:"O teste de regressão falha antes da correção, passa depois e fica de guarda para sempre.",analogy:"É uma vacina: o sistema conhece o invasor uma vez e passa a reconhecê-lo sempre que ele tentar voltar."},
d1:{title:"A classe que faz de tudo",prompt:"A classe Relatorio calcula os totais, gera o PDF e envia o e-mail. Qual princípio ela viola?",opts:["Responsabilidade única (SRP)","Substituição de Liskov (LSP)","Inversão de dependência (DIP)","Nenhum: concentrar tudo facilita a manutenção"],hint:"Quantos motivos diferentes existem para alterar essa classe?",why:"Ela muda se a regra de cálculo, o layout do PDF ou o servidor de e-mail mudarem. Três motivos indicam três responsabilidades.",analogy:"Canivete suíço é prático no acampamento, mas numa cozinha profissional cada faca tem sua função, e afiar uma não estraga as outras."},
d2:{title:"Função de 300 linhas",prompt:"A função de cobrança repete o mesmo bloco de validação em três pontos. Qual é a melhor refatoração?",opts:["Extrair o bloco repetido para uma função com nome claro","Colocar comentários explicando cada repetição","Dividir o arquivo em dois, mantendo a função","Deixar como está, porque funciona"],hint:"Pense no princípio DRY: não se repita.",why:"Extrair função elimina a duplicação: a correção passa a ser feita em um só lugar, e o nome documenta a intenção.",analogy:"Em vez de reescrever o endereço em cada carta, você faz um carimbo. Mudou o endereço? Troca-se o carimbo, não todas as cartas."},
d3:{title:"Coesão e acoplamento",prompt:"Em um bom projeto de módulos, busca-se:",opts:["Alta coesão e baixo acoplamento","Baixa coesão e alto acoplamento","Alta coesão e alto acoplamento","Tanto faz, desde que os testes passem"],hint:"Coesão é o foco interno do módulo; acoplamento é o quanto ele depende dos outros.",why:"Módulos focados e pouco dependentes entre si podem ser entendidos, testados e trocados isoladamente.",analogy:"Peças de LEGO: cada uma tem forma bem definida (coesão) e um encaixe simples e padronizado (baixo acoplamento)."},
d4:{title:"Mais um \"se\" no pagamento",prompt:"Cada nova forma de pagamento exige editar esta função. Qual mudança de design resolve melhor?",opts:["Criar uma interface Pagamento e uma implementação para cada forma","Adicionar o novo \"se\" e um comentário","Copiar a função inteira para cada forma de pagamento","Trocar a cadeia de condições por um laço while"],hint:"Princípio aberto/fechado: aberto para extensão, fechado para modificação.",why:"Com polimorfismo (padrão Strategy), uma nova forma de pagamento vira um novo módulo, sem tocar no código que já funciona e já foi testado.",analogy:"É a tomada padrão: qualquer aparelho novo se conecta sem que alguém precise quebrar a parede e refazer a fiação."},
d5:{title:"O banco de dados soldado na classe",prompt:"A classe Pedido cria dentro de si a conexão com um banco MySQL específico. O que isso dificulta e como resolver?",opts:["Testar e trocar o banco; receber a dependência pronta, por uma interface","Nada; criar a conexão lá dentro é o mais organizado","A velocidade; resolver com um servidor mais potente","A leitura; resolver com mais comentários"],hint:"Como você testaria Pedido sem um MySQL ligado?",why:"Criar a dependência concreta internamente acopla a classe a ela. Com injeção de dependência, a classe recebe algo que cumpre uma interface, e nos testes recebe um substituto.",analogy:"Luminária com a lâmpada soldada: queimou, joga-se tudo fora. Com soquete padrão, troca-se só a lâmpada, inclusive por uma de teste."}
}
};
